const BADGES = [
  { id: 'sansfaute', nom: 'Sans faute', desc: 'Une montée sans te planter', ic: 'heart' },
  { id: 'jardinier', nom: 'Jardinier', desc: '100 fleurs dans une partie', ic: 'fleur' },
  { id: 'dompteur', nom: "Dompteur d'ours", desc: 'Chasser 10 ours', ic: 'ours' },
  { id: 'ventdos', nom: 'Vent dans le dos', desc: 'Utiliser 10 boosts', ic: 'vent' },
  { id: 'bleuetiere', nom: 'Bleuetière', desc: 'Remplir la jauge de vent', ic: 'bleuet' },
  { id: 'rodeo', nom: 'Rodéo', desc: 'Rebondir sur une vache', ic: 'vache' },
  { id: 'passager', nom: 'Passager clandestin', desc: 'Un tour sur le tracteur', ic: 'tracteur' },
  { id: 'parfum', nom: 'Parfum spécial', desc: 'Arrosé par une mouffette', ic: 'mouffette' },
  { id: 'baignade', nom: 'Baignade surprise', desc: 'Tomber dans le ruisseau', ic: 'sueur' },
  { id: 'photobombe', nom: 'Photobombe', desc: 'Du vent sur une photo de noces', ic: 'marie' },
  { id: 'coupdefoudre', nom: 'Coup de foudre', desc: 'Didi conquise en 5 visites', ic: 'heartBig' },
  { id: 'wheelie', nom: 'Roi du wheelie', desc: 'Un wheelie de 3 secondes', ic: 'wheelie' },
  { id: 'oui', nom: 'Oui, je le veux!', desc: 'Finir le jeu', ic: 'bouquet' },
  { id: 'fringant', nom: 'Toujours fringant', desc: 'Sonner 5 fois en tandem', ic: 'tandem' },
];
G.badges = load('gd_badges', {}) || {};
G.compteurs = load('gd_compteurs', {}) || {};

function iconeBadge(ic) {
  const m = { wheelie: SPR.happy[0], fleur: SPR.fleurs[0], ours: SPR.ours[0], vache: SPR.vache[0], tracteur: SPR.tracteur[0], mouffette: SPR.mouffette[0], tandem: SPR.tandem[0] };
  return m[ic] || SPR[ic];
}
function badge(id) {
  if (!G.badges || G.badges[id]) return;
  const b = BADGES.find(x => x.id === id);
  if (!b) return;
  G.badges[id] = Date.now(); store('gd_badges', G.badges);
  G.toasts = G.toasts || []; G.toasts.push({ b, t: 0 });
  Sound.fx('badge'); vibrer(60);
}
function compter(nom, seuil, id) {
  G.compteurs[nom] = (G.compteurs[nom] || 0) + 1; store('gd_compteurs', G.compteurs);
  if (G.compteurs[nom] >= seuil) badge(id);
}
function vibrer(p) { try { if (touchMode && navigator.vibrate) navigator.vibrate(p); } catch (e) { } }
function nbBadges() { return BADGES.filter(b => G.badges[b.id]).length; }

function dessinIcone(img, cx, cy, maxW, maxH) {
  if (!img) return;
  const k = Math.min(1, maxW / img.width, maxH / img.height);
  const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
  g.drawImage(img, Math.round(cx - w / 2), Math.round(cy - h / 2), w, h);
}
function drawToasts(dt) {
  if (!G.toasts || !G.toasts.length) return;
  if (['badges', 'honneur', 'aide', 'titre', 'bilan'].includes(G.state) || G.finEtape) return;
  const T = G.toasts[0];
  T.t += dt;
  if (T.t > 2.6) { G.toasts.shift(); return; }
  const y = T.t < .3 ? 185 - T.t / .3 * 37 : T.t > 2.3 ? 148 + (T.t - 2.3) / .3 * 37 : 148;
  panel(90, y, 140, 26);
  dessinIcone(iconeBadge(T.b.ic), 106, y + 13, 18, 16);
  txt('Badge débloqué!', 120, y + 5, 4, '#ffe060');
  txt(T.b.nom, 120, y + 14, 5, '#ffffff');
}

// ---- écran des badges ----
function drawBadges() {
  drawWorld(); TQ.length = 0;
  g.fillStyle = 'rgba(16,8,28,.65)'; g.fillRect(0, 0, W, H);
  panel(8, 6, 304, 168);
  txt('Badges · ' + nbBadges() + '/' + BADGES.length, 160, 12, 7, '#ffe9a8', 'center');
  BADGES.forEach((b, i) => {
    const rows = Math.ceil(BADGES.length / 3), rh = Math.min(34, Math.floor(134 / rows));
    const col = i % 3, row = (i / 3) | 0, x = 14 + col * 99, y = 25 + row * rh;
    const ok = !!G.badges[b.id];
    rect(x, y, 95, rh - 2, ok ? '#3a2a5a' : '#221a30'); rect(x, y, 95, 1, ok ? '#ffe060' : '#3a3050');
    if (ok) dessinIcone(iconeBadge(b.ic), x + 12, y + (rh - 2) / 2, 18, rh - 6);
    else txt('?', x + 12, y + (rh - 2) / 2 - 4, 8, '#5a4a7a', 'center');
    txt(b.nom, x + 24, y + 4, 4, ok ? '#ffffff' : '#8a7aa0');
    wrap(b.desc, 3.4, 68).slice(0, 2).forEach((l, k) => txt(l, x + 24, y + 11 + k * 5.5, 3.4, ok ? '#d8d0f0' : '#6a5a80'));
  });
  if (((G.t * 2) | 0) % 2) txt(touchMode ? 'Touche pour revenir' : 'Entrée pour revenir', 160, 165, 4, '#ffd0dc', 'center');
}

// ---- suivi des parties (seulement quand le serveur du jeu répond) ----
const API_EVT = 'api/evt';
const SUIVI = { pret: false, actif: false, file: [], sid: null, vid: null };
function idAleatoire() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { }
  return 'x' + Math.random().toString(36).slice(2) + Date.now().toString(36);
}
SUIVI.vid = load('gd_vid', null);
if (!SUIVI.vid) { SUIVI.vid = idAleatoire(); store('gd_vid', SUIVI.vid); }
SUIVI.sid = idAleatoire();
function envoyerEvt(e) {
  const corps = JSON.stringify(e);
  try {
    if (navigator.sendBeacon && navigator.sendBeacon(API_EVT, new Blob([corps], { type: 'application/json' }))) return;
  } catch (x) { }
  fetch(API_EVT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: corps, keepalive: true }).catch(() => { });
}
function suivi(type, visite, d) {
  const e = { vid: SUIVI.vid, sid: SUIVI.sid, type, visite: visite == null ? null : visite, d: d || null };
  if (!SUIVI.pret) { SUIVI.file.push(e); return; }
  if (SUIVI.actif) envoyerEvt(e);
}
function demarrerSuivi() {
  if (!/^https?:$/.test(location.protocol)) { SUIVI.pret = true; SUIVI.file = []; return; }
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 4000);
  fetch('api/scores', { cache: 'no-store', signal: ctl.signal })
    .then(r => { clearTimeout(to); SUIVI.actif = r.ok && (r.headers.get('content-type') || '').includes('json'); })
    .catch(() => { SUIVI.actif = false; })
    .finally(() => { SUIVI.pret = true; const f = SUIVI.file; SUIVI.file = []; if (SUIVI.actif) f.forEach(envoyerEvt); });
}

// ---- tableau d'honneur (serveur si disponible, sinon sur l'appareil) ----
const API_SCORES = 'api/scores';
G.scores = []; G.enLigne = false;
function trierScores(a) {
  return a.sort((x, y) => (y.points || 0) - (x.points || 0) || x.visites - y.visites || x.temps - y.temps);
}
async function chargerScores() {
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 3000);
    const r = await fetch(API_SCORES, { cache: 'no-store', signal: ctl.signal });
    clearTimeout(to);
    if (!r.ok) throw 0;
    const j = await r.json();
    if (!Array.isArray(j)) throw 0;
    G.enLigne = true; G.scores = j;
  } catch (e) {
    G.enLigne = false; G.scores = trierScores(load('gd_scores', []) || []);
  }
}
async function envoyerScore(s) {
  let ok = false;
  if (G.enLigne) {
    try {
      const r = await fetch(API_SCORES, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(s) });
      ok = r.ok;
    } catch (e) { }
  }
  if (!ok) {
    const loc = load('gd_scores', []) || [];
    loc.push(Object.assign({ ts: Math.floor(Date.now() / 1000) }, s));
    store('gd_scores', trierScores(loc).slice(0, 20));
  }
  await chargerScores();
}
function drawHonneur(surFond) {
  if (surFond !== false) { drawWorld(); TQ.length = 0; }
  g.fillStyle = 'rgba(16,8,28,.7)'; g.fillRect(0, 0, W, H);
  panel(12, 6, 296, 168);
  txt("Tableau d'honneur", 160, 12, 8, '#ffe9a8', 'center');
  txt(G.enLigne ? 'Toute la famille' : 'Sur cet appareil', 160, 24, 4, '#d8d0f0', 'center');
  const cols = [[22, 'Rang', 'left'], [44, 'Nom', 'left'], [190, 'Points', 'right'], [228, 'Visites', 'right'], [262, 'Fleurs', 'right'], [296, 'Badges', 'right']];
  for (const [x, t, a] of cols) txt(t, x, 34, 3.6, '#ffb0c8', a);
  rect(20, 41, 280, 1, '#5a4a7a');
  const liste = G.scores.slice(0, 10);
  if (!liste.length) txt('Personne encore... sois le premier!', 160, 90, 5, '#ffffff', 'center');
  liste.forEach((s, i) => {
    const y = 45 + i * 11, moi = G.monScore && s.nom === G.monScore.nom && s.points === G.monScore.points;
    if (moi) rect(18, y - 2, 284, 10, 'rgba(255,224,96,.18)');
    const c = i === 0 ? '#ffe060' : '#ffffff';
    txt((i + 1) + '.', 22, y, 4.5, c); txt(String(s.nom).slice(0, 16), 44, y, 4.5, c);
    txt('' + (s.points || 0), 190, y, 4.5, c, 'right'); txt('' + s.visites, 228, y, 4.5, c, 'right');
    txt('' + s.fleurs, 262, y, 4.5, c, 'right'); txt('' + (s.badges || 0), 296, y, 4.5, c, 'right');
  });
  if (((G.t * 2) | 0) % 2) txt(touchMode ? 'Touche pour continuer' : 'Entrée pour continuer', 160, 165, 4, '#ffd0dc', 'center');
}

// ---- pointage ----
const POINTS = { wheelie: 10, fleur: 10, coeur: 5, ventPct: 2, secondeGagnee: 8, visiteEpargnee: 150, ours: 20, sansFaute: 100, plantage: -25 };
function calculerPoints() {
  const p = G.partie || {};
  const lignes = [
    ['Fleurs cueillies', G.totalFleurs, G.totalFleurs * POINTS.fleur],
    ['Coeurs de bonheur', p.coeurs || 0, (p.coeurs || 0) * POINTS.coeur],
    ['Vent dans la jauge', Math.floor(G.pet) + ' %', Math.floor(G.pet) * POINTS.ventPct],
    ['Rapidité', Math.round(p.temps || 0) + ' s', Math.max(0, Math.round(((p.par || 0) - (p.temps || 0)) * POINTS.secondeGagnee))],
    ['Visites (' + G.visite + ')', '', Math.max(0, (12 - G.visite) * POINTS.visiteEpargnee)],
    ['Ours chassés', p.ours || 0, (p.ours || 0) * POINTS.ours],
    ['Montées sans faute', p.sansFaute || 0, (p.sansFaute || 0) * POINTS.sansFaute],
    ['Wheelies', Math.round(p.wheelie || 0) + ' s', Math.round((p.wheelie || 0) * POINTS.wheelie)],
    ['Plantages', p.plantes || 0, (p.plantes || 0) * POINTS.plantage],
  ];
  const total = Math.max(0, lignes.reduce((a, l) => a + l[2], 0));
  return { lignes, total };
}
function drawPointage(t) {
  TQ.length = 0;
  g.fillStyle = 'rgba(16,8,28,.72)'; g.fillRect(0, 0, W, H);
  panel(30, 8, 260, 164);
  txt('Le pointage', 160, 14, 8, '#ffe9a8', 'center');
  const { lignes, total } = G.pointage;
  const vis = Math.min(lignes.length, Math.floor(t / .35));
  let somme = 0;
  lignes.forEach((l, i) => {
    if (i >= vis) return;
    const y = 30 + i * 12;
    txt(l[0], 42, y, 4.6, '#d8d0f0'); txt('' + l[1], 196, y, 4.6, '#ffffff', 'right');
    txt((l[2] > 0 ? '+' : '') + l[2], 278, y, 4.6, l[2] < 0 ? '#ff8a9a' : '#b4ff9a', 'right');
    somme += l[2];
  });
  rect(40, 141, 240, 1, '#5a4a7a');
  const affiche = vis >= lignes.length ? Math.round(Math.min(1, (t - lignes.length * .35) / 1) * total) : Math.max(0, somme);
  txt('TOTAL', 42, 145, 7, '#ffe060'); txt(affiche + ' pts', 278, 145, 7, '#ffe060', 'right');
  if (t > lignes.length * .35 + 1.2 && ((G.t * 2) | 0) % 2) txt(touchMode ? 'Touche pour continuer' : 'Entrée pour continuer', 160, 161, 4.5, '#ffd0dc', 'center');
}

// ---- saisie du nom (champ HTML pour avoir le clavier du téléphone) ----
function ouvrirNom() {
  const box = $('nomBox'), inpN = $('nomInput');
  box.style.display = 'flex';
  const pts = G.pointage ? G.pointage.total : 0;
  box.querySelector('.nomTitre').innerHTML = 'Bravo! ' + pts + ' points<br>Inscris ton nom au tableau d\'honneur';
  inpN.value = load('gd_nom', '') || '';
  setTimeout(() => { try { inpN.focus(); } catch (e) { } }, 50);
}
function fermerNom() { $('nomBox').style.display = 'none'; try { $('nomInput').blur(); } catch (e) { } }
async function validerNom() {
  const nom = ($('nomInput').value || '').replace(/[<>]/g, '').trim().slice(0, 16);
  if (!nom) return;
  store('gd_nom', nom);
  fermerNom();
  const p = G.partie || {};
  const pts = (G.pointage || calculerPoints()).total;
  G.monScore = { nom, points: pts, visites: G.visite, fleurs: G.totalFleurs, plantes: p.plantes || 0, temps: Math.round(p.temps || 0), badges: nbBadges() };
  G.finEtape = 'envoi';
  suivi('score', G.visite, { points: pts });
  await envoyerScore(G.monScore);
  G.finEtape = 'honneur';
}
$('nomOk').addEventListener('click', validerNom);
$('nomPasser').addEventListener('click', () => { fermerNom(); G.finEtape = 'honneur'; chargerScores(); });
$('nomInput').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); validerNom(); } });
chargerScores();

// le suivi démarre une fois tout le code chargé (extras.js est le dernier fichier)
demarrerSuivi();
suivi('ouverture', null, { largeur: innerWidth, hauteur: innerHeight, tactile: touchMode });

</script>
