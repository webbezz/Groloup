const PET = { bleuet: 8, cout: 25, duree: 1.3 };

const SAISONS = ['printemps', 'ete', 'automne', 'nuit'];
const SAISON_NOM = { printemps: 'Printemps', ete: 'Été', automne: 'Automne', nuit: 'Un soir étoilé' };

function paramsVisite(n) {
  const d = Math.min(1, (n - 1) / 6);
  return {
    L: Math.round((2300 + d * 1500) * 1.1 * 1.15), minS: .05 + d * .06, maxS: .15 + d * .13,
    ruisseaux: n < 2 ? 0 : n < 5 ? 1 : 2,
    poids: {
      roche: 3, nid: 3, boue: 2, ours: 1 + d * 3, oiseau: 3 + d * 1.5, chien: 1 + d * 1.5, vache: .6 + d * .4, tracteur: n < 2 ? 0 : .8,
      mouffette: n < 2 ? 0 : 1 + d, foin: 2.5, billot: d * 2, pommier: 2.5, fleurs: 4,
    },
  };
}

];
function humeur(a) { let h = HUMEUR[0][1]; for (const [s, n] of HUMEUR) if (a >= s) h = n; return h; }

// Pioche sans remise: chaque paquet est mélangé, puis vidé avant d'être remélangé
// Les paquets de répliques sont gardés sur l'appareil (gd_paquets), d'une partie à l'autre:
// une nouvelle partie continue où la dernière s'est arrêtée, donc on voit tout avant qu'une réplique revienne.
function chargerPaquets() {
  const p = load('gd_paquets', null) || {};
  G.decks = p.decks || {}; G.derniers = p.derniers || {}; G.tailles = p.tailles || {};
}
function sauverPaquets() { store('gd_paquets', { decks: G.decks, derniers: G.derniers, tailles: G.tailles }); }
function piocher(nom, arr, ok) {
  G.decks = G.decks || {}; G.derniers = G.derniers || {}; G.tailles = G.tailles || {};
  // des répliques ont été ajoutées depuis la dernière partie: elles entrent dans le paquet (jamais vues)
  const avant = G.tailles[nom];
  if (G.decks[nom] && avant != null && arr.length > avant) {
    for (let i = avant; i < arr.length; i++) G.decks[nom].splice((Math.random() * (G.decks[nom].length + 1)) | 0, 0, i);
  }
  G.tailles[nom] = arr.length;
  const melanger = () => {
    const d = arr.map((_, i) => i);
    for (let i = d.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [d[i], d[j]] = [d[j], d[i]]; }
    if (d.length > 1 && d[0] === G.derniers[nom]) [d[0], d[1]] = [d[1], d[0]];
    return (G.decks[nom] = d);
  };
  let d = G.decks[nom];
  if (!d || !d.length || d.some(i => i >= arr.length)) d = melanger();
  let k = ok ? d.findIndex(i => ok(arr[i])) : 0;
  if (k < 0) {
    // plus rien de convenable dans le paquet: on rebrasse tout
    d = melanger(); k = d.findIndex(i => ok(arr[i]));
    if (k < 0) return null;
  }
  const i = d.splice(k, 1)[0];
  G.derniers[nom] = i;
  sauverPaquets();
  return arr[i];
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
function rngOf(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hsh(n) {
  let h = (Math.imul(n | 0, 374761393) + 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return h >>> 0;
}
function pick(rng, weights) {
  let tot = 0;
  for (const k in weights) tot += weights[k];
  let r = rng() * tot;
  for (const k in weights) { r -= weights[k]; if (r <= 0) return k; }
  return Object.keys(weights)[0];
}
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteFreq(s) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(s);
  if (!m) return 0;
  let n = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  const midi = 12 * (+m[3] + 1) + n;
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function parseTrack(str) {
  const toks = str.trim().split(/\s+/);
  const ev = new Array(toks.length).fill(null);
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (t === '-' || t === '.') continue;
    let len = 1;
    while (i + len < toks.length && toks[i + len] === '-') len++;
    ev[i] = { f: noteFreq(t), len };
  }
  return ev;
}
function bassLine(roots, pat) {
  // pat: 'R' racine, 'O' octave, '-' tenue, '.' silence
  let s = [];
  for (const r of roots) {
    const oct = r.replace(/\d/, d => +d + 1);
    for (const c of pat) s.push(c === 'R' ? r : c === 'O' ? oct : c);
  }
  return s.join(' ');
}

function mkCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  return [c, x];
}
function P1(x, X, Y, col) { x.fillStyle = col; x.fillRect(Math.round(X), Math.round(Y), 1, 1); }
function LN(x, x0, y0, x1, y1, col) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy; x.fillStyle = col;
  for (let n = 0; n < 200; n++) {
    x.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function LN2(x, x0, y0, x1, y1, col) { LN(x, x0, y0, x1, y1, col); LN(x, x0 + 1, y0, x1 + 1, y1, col); }
function CIRC(x, cx, cy, r, col) {
  x.fillStyle = col;
  for (let a = 0; a < 64; a++) {
    const t = a / 64 * Math.PI * 2;
    x.fillRect(Math.round(cx + Math.cos(t) * r), Math.round(cy + Math.sin(t) * r), 1, 1);
  }
}
function DISC(x, cx, cy, rx, ry, col) {
  x.fillStyle = col;
  for (let y = -ry; y <= ry; y++) {
    const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
    x.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1);
  }
}
function rect2(x, X, Y, w, h, col) { x.fillStyle = col; x.fillRect(X, Y, w, h); }
function ascii(rows, pal, flip) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const [c, x] = mkCanvas(w, h);
  rows.forEach((r, y) => {
    for (let i = 0; i < r.length; i++) {
      const col = pal[r[i]];
      if (col) P1(x, flip ? w - 1 - i : i, y, col);
    }
  });
  return c;
}
function stamp(x, rows, pal, ox, oy) {
  rows.forEach((r, y) => { for (let i = 0; i < r.length; i++) { const col = pal[r[i]]; if (col) P1(x, ox + i, oy + y, col); } });
}
function ik(ax, ay, bx, by, l1, l2, pickFn) {
  let dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
  const maxd = l1 + l2 - .01;
  if (d > maxd) { bx = ax + dx / d * maxd; by = ay + dy / d * maxd; dx = bx - ax; dy = by - ay; d = maxd; }
  if (d < .01) return [ax, ay + l1];
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const mx = ax + a * dx / d, my = ay + a * dy / d;
  const k1 = [mx - h * dy / d, my + h * dx / d], k2 = [mx + h * dy / d, my - h * dx / d];
  return pickFn(k1, k2) ? k1 : k2;
}

function drawBikeFrame(x, ox, wheelA, crank, opt) {
  opt = opt || {};
  const R = [ox + 7, 30], F = [ox + (opt.long || 25), 30], BB = [ox + 15, 29];
  // roues
  for (const c of [R, F]) {
    CIRC(x, c[0], c[1], 5, BIKE.tire); CIRC(x, c[0], c[1], 4.4, BIKE.tire);
    for (let s = 0; s < 3; s++) {
      const a = wheelA + s * Math.PI / 3;
      LN(x, c[0] - Math.cos(a) * 3.6, c[1] - Math.sin(a) * 3.6, c[0] + Math.cos(a) * 3.6, c[1] + Math.sin(a) * 3.6, '#8a929c');
    }
    P1(x, c[0], c[1], BIKE.chrome);
  }
  const fr = BIKE.frame, fd = BIKE.frameD;
  const seats = opt.seats || [ox + 12];
  const bbs = opt.bbs || [ox + 15];
  const HT = [F[0] - 4, 21], HB = [F[0] - 3, 24];
  LN(x, R[0], R[1], bbs[0], 29, fd);
  LN(x, R[0], R[1], seats[0], 22, fd);
  for (let i = 0; i < seats.length; i++) {
    LN(x, bbs[i], 29, seats[i], 21, fr);
    x.fillStyle = BIKE.saddle; x.fillRect(seats[i] - 2, 20, 4, 1);
    // plateau
    CIRC(x, bbs[i], 29, 1.6, BIKE.chrome);
  }
  if (seats.length > 1) { LN(x, bbs[0], 29, bbs[1], 29, fr); LN(x, seats[0], 22, seats[1], 22, fr); }
  LN(x, seats[seats.length - 1], 21, HT[0], HT[1], fr);
  LN(x, bbs[bbs.length - 1], 29, HT[0], HT[1] + 2, fr);
  LN(x, HT[0], HT[1], HB[0], HB[1], fr);
  LN(x, HB[0], HB[1], F[0], F[1], BIKE.chrome);
  // guidon
  LN(x, HT[0], HT[1], HT[0], 19, BIKE.chrome);
  LN(x, HT[0], 19, HT[0] + 2, 19, BIKE.chrome);
  P1(x, HT[0] + 3, 20, BIKE.chrome); P1(x, HT[0] + 3, 21, BIKE.saddle); P1(x, HT[0] + 2, 22, BIKE.saddle);
  // garde-boue
  LN(x, R[0] - 5, 28, R[0] - 2, 25, BIKE.chrome);
  for (const b of bbs) {
    const ax = Math.cos(crank) * 3, ay = Math.sin(crank) * 3;
    LN(x, b, 29, b + ax, 29 + ay, BIKE.chrome);
  }
}
function makeCyclist(head, pose, f, look, extra) {
  const [c, x] = mkCanvas(32, 36);
  const crank = f / 8 * Math.PI * 2, wheelA = -f / 8 * Math.PI;
  const o = {
    ox: 0, hip: [12, 19], bb: [15, 29], crank, look, head, plaid: false,
    sh: pose === 'effort' ? [17, 12] : [15, 11], hand: pose === 'effort' ? [23, 20] : [22, 19],
    hairFlow: extra && extra.hairFlow ? f : null,
  };
  const r = drawRider(x, o);
  drawBikeFrame(x, 0, wheelA, crank);
  drawRiderFront(x, o, r);
  return c;
}
function makeWalker(f, look, standing) {
  const [c, x] = mkCanvas(32, 36);
  drawBikeFrame(x, 0, 0, 0);
  const ph = f / 6 * Math.PI * 2;
  const hip = [9, 25], sh = standing ? [10, 16] : [12, 17], hand = [22, 19];
  const st = standing ? 0 : 3.2;
  const f1 = [9 + st * Math.sin(ph), 35 - (standing ? 0 : Math.max(0, Math.cos(ph)) * 1.5)];
  const f2 = [9 - st * Math.sin(ph), 35 - (standing ? 0 : Math.max(0, -Math.cos(ph)) * 1.5)];
  const fwd = (a, b) => a[0] > b[0];
  const k2 = ik(hip[0], hip[1], f2[0], f2[1], 5.5, 5.5, fwd);
  LN2(x, hip[0], hip[1], k2[0], k2[1], look.pantsD); LN2(x, k2[0], k2[1], f2[0], f2[1], look.pantsD);
  x.fillStyle = look.shoe; x.fillRect(Math.round(f2[0]), 34, 3, 2);
  const o = { look, head: standing ? 'groloupHappy' : 'groloupEffort', plaid: false, leg: 5.5 };
  drawRiderFront(x, o, { hip, sh, hand: standing ? [14, 24] : hand, p1: f1 });
  return c;
}
function makeTandem(f) {
  const [c, x] = mkCanvas(46, 36);
  const crank = f / 8 * Math.PI * 2, wheelA = -f / 8 * Math.PI;
  const D = LOOK.didiVieille, G = LOOK.groloupVieux;
  const oD = { ox: 0, hip: [12, 19], bb: [15, 29], crank: crank + Math.PI, look: D, head: 'didiVieille', sh: [14, 11], hand: [21, 17], plaid: false };
  const oG = { ox: 15, hip: [12, 19], bb: [15, 29], crank, look: G, head: 'groloupVieux', sh: [15, 11], hand: [22, 19], plaid: false };
  const rD = drawRider(x, oD), rG = drawRider(x, oG);
  drawBikeFrame(x, 0, wheelA, crank, { long: 40, seats: [12, 27], bbs: [15, 30] });
  P1(x, 39, 18, '#ffd23a'); P1(x, 40, 18, '#ffd23a'); P1(x, 39, 19, '#c8961a'); P1(x, 40, 19, '#c8961a');
  drawRiderFront(x, oD, rD);
  drawRiderFront(x, oG, rG);
  return c;
}

function buildBackground(pal) {
  const bg = {};
  // ciel en bandes
  {
    const [c, x] = mkCanvas(W, H);
    const n = pal.sky.length, bh = Math.ceil(130 / n);
    x.fillStyle = pal.sky[n - 1]; x.fillRect(0, 0, W, H);
    for (let i = 0; i < n; i++) {
      x.fillStyle = pal.sky[i]; x.fillRect(0, i * bh, W, bh);
      if (i < n - 1) { // tramage entre les bandes
        x.fillStyle = pal.sky[i + 1];
        for (let px = 0; px < W; px += 2) { x.fillRect(px + (i & 1), i * bh + bh - 2, 1, 1); x.fillRect(px + 1 - (i & 1), i * bh + bh - 1, 1, 1); }
      }
    }
    if (pal.night) {
      const r = rngOf(7);
      for (let i = 0; i < 90; i++) { x.fillStyle = r() < .2 ? '#ffffff' : '#9aa6d8'; x.fillRect((r() * W) | 0, (r() * 110) | 0, 1, 1); }
    }
    bg.sky = c;
  }
  // montagnes (Appalaches) — tuile de 640
  {
    const [c, x] = mkCanvas(640, 110);
    for (let i = 0; i < 640; i++) {
      const t = i / 640 * Math.PI * 2;
      const h = 46 + 14 * Math.sin(t + 1) + 9 * Math.sin(t * 3 + .5) + 4 * Math.sin(t * 7 + 2) + 2 * Math.sin(t * 13);
      const top = Math.round(110 - h);
      x.fillStyle = pal.mtn; x.fillRect(i, top, 1, 110 - top);
      x.fillStyle = pal.mtnL; x.fillRect(i, top, 1, 2);
    }
    bg.mtn = c;
  }
  // collines boisées avec épinettes
  {
    const [c, x] = mkCanvas(640, 90);
    const tops = [];
    for (let i = 0; i < 640; i++) {
      const t = i / 640 * Math.PI * 2;
      const h = 40 + 8 * Math.sin(t * 2 + 3) + 5 * Math.sin(t * 5 + 1);
      tops[i] = Math.round(90 - h);
      x.fillStyle = pal.hill; x.fillRect(i, tops[i], 1, 90 - tops[i]);
    }
    for (let i = 0; i < 640; i += 5) {
      const hh = 7 + (hsh(i * 7) % 9), bx = i + (hsh(i) % 3);
      const base = tops[bx % 640] + 3;
      for (let k = 0; k < hh; k++) {
        const w = Math.max(0, Math.floor((k + 1) / 2.2));
        x.fillStyle = (k % 3 === 0) ? pal.hillD : pal.tree;
        x.fillRect(((bx - w) % 640 + 640) % 640, base - hh + k, w * 2 + 1, 1);
      }
    }
    bg.hill = c;
  }
  // arbres de bord de route
  bg.epinette = (() => {
    const [c, x] = mkCanvas(13, 30);
    x.fillStyle = '#4a3020'; x.fillRect(6, 24, 2, 6);
    for (let k = 0; k < 26; k++) {
      const w = Math.floor(((k % 8) + k / 2.2) / 2.2);
      x.fillStyle = (k % 8 > 5) ? pal.treeD : pal.tree;
      x.fillRect(6 - w, k, w * 2 + 1, 1);
    }
    return c;
  })();
  bg.feuillu = (() => {
    const [c, x] = mkCanvas(20, 28);
    x.fillStyle = '#5a3a22'; x.fillRect(9, 14, 3, 14);
    DISC(x, 10, 10, 9, 8, pal.leafD); DISC(x, 9, 8, 7, 6, pal.leaf);
    for (let i = 0; i < 18; i++) P1(x, 3 + (hsh(i * 3) % 14), 3 + (hsh(i * 5) % 12), pal.leafD);
    return c;
  })();
  bg.bouleau = (() => {
    const [c, x] = mkCanvas(14, 30);
    x.fillStyle = '#eeeae0'; x.fillRect(6, 10, 2, 20);
    for (let i = 0; i < 6; i++) P1(x, 6 + (i & 1), 12 + i * 3, '#2a2a2a');
    DISC(x, 7, 8, 6, 7, pal.leaf); DISC(x, 6, 6, 4, 4, pal.leafD);
    return c;
  })();
  bg.pommier = (() => {
    const [c, x] = mkCanvas(24, 30);
    x.fillStyle = '#5a3a22'; x.fillRect(11, 14, 3, 16); LN(x, 12, 18, 6, 12, '#5a3a22'); LN(x, 13, 17, 18, 12, '#5a3a22');
    DISC(x, 12, 9, 11, 8, pal.night ? pal.leafD : '#3f8a34'); DISC(x, 11, 7, 8, 6, pal.night ? pal.leaf : '#58a840');
    for (let i = 0; i < 8; i++) P1(x, 3 + (hsh(i * 11) % 18), 3 + (hsh(i * 13) % 12), '#d82a2a');
    return c;
  })();
  return bg;
}

// ---------------- GÉNÉRATION D'UNE VISITE ----------------
function buildUp(n, seed, ev) {
  const p = paramsVisite(n), rng = rngOf(seed), L = p.L, d = Math.min(1, (n - 1) / 6);
  if (ev && ev.poids) for (const k in ev.poids) if (k in p.poids) p.poids[k] *= ev.poids[k];
  const slope = new Float32Array(L + 2);
  const segs = [];
  let x = 0;
  const push = (len, s, tag) => { len = Math.round(len); segs.push({ x0: x, x1: x + len, s, tag }); x += len; };
  push(240, 0, 'debut');
  const cpEvery = L / 3; let nextCp = cpEvery;
  const creekAt = [];
  for (let k = 0; k < p.ruisseaux; k++) creekAt.push(L * (k + 1) / (p.ruisseaux + 1) + (rng() - .5) * 200);
  while (x < L - 320) {
    if (x >= nextCp) { push(100, 0, 'repos'); nextCp += cpEvery; }
    else if (creekAt.length && x >= creekAt[0]) { creekAt.shift(); push(170, 0, 'ruisseau'); }
    else {
      push(130 + rng() * 170, p.minS + rng() * (p.maxS - p.minS));
      if (rng() < .35) push(50 + rng() * 60, .01);
    }
  }
  push(L + 1 - x, 0, 'fin');
  for (const s of segs) for (let i = s.x0; i < s.x1 && i <= L + 1; i++) slope[i] = s.s;
  // lissage
  const sm = new Float32Array(L + 2), Wd = 20;
  for (let i = 0; i <= L + 1; i++) {
    let a = 0, c = 0;
    for (let k = -Wd; k <= Wd; k++) { const j = i + k; if (j >= 0 && j <= L + 1) { a += slope[j]; c++; } }
    sm[i] = a / c;
  }
  for (const s of segs) if (s.tag === 'ruisseau') for (let i = s.x0 + 25; i < s.x1 - 25; i++) sm[i] = 0;
  const gy = new Float32Array(L + 2);
  gy[0] = 0;
  for (let i = 1; i <= L + 1; i++) gy[i] = gy[i - 1] - sm[i - 1];

  const lev = { L, gy, gap: new Uint8Array(L + 2), creeks: [], solids: [], zones: [], items: [], enemies: [], decor: [], cps: [], down: false };
  const G = i => gy[clamp(Math.round(i), 0, L)];
  const busy = [];
  for (const s of segs) {
    if (s.tag === 'ruisseau') {
      const gw = Math.round(30 + d * 10), g0 = s.x0 + 70;
      for (let i = g0; i < g0 + gw; i++) lev.gap[i] = 1;
      lev.creeks.push({ x0: s.x0 + 20, x1: s.x1 - 20, g0, g1: g0 + gw, y: G(s.x0 + 40) });
      busy.push([s.x0 - 50, s.x1 + 40]);
      lev.items.push({ k: 'fleur', x: g0 + gw / 2, y: G(g0) - 34, v: 2 });
    }
    if (s.tag === 'repos') {
      const cx = (s.x0 + s.x1) / 2;
      lev.cps.push({ x: cx, on: false });
      busy.push([s.x0 - 30, s.x1 + 30]);
    }
  }
  lev.homeX = 70; lev.didiX = L - 120;
  lev.decor.push({ k: 'maison', x: lev.homeX, style: 'groloup' });
  lev.decor.push({ k: 'maison', x: lev.didiX, style: 'didi' });
  lev.decor.push({ k: 'panneau', x: 150 });
  const isBusy = xx => xx < 300 || xx > L - 330 || busy.some(b => xx > b[0] && xx < b[1]);

  // obstacles et ennemis aléatoires
  // variété: jamais deux fois de suite la même embûche, et un maximum par sorte
  const caps = { vache: 2, tracteur: 1, ours: 2 + Math.round(d * 3), chien: 2 + Math.round(d * 2), mouffette: 1 + Math.round(d * 2),
    billot: 3, foin: 4, boue: 4, nid: 5, roche: 5, oiseau: 4 + Math.round(d * 3), pommier: 4, fleurs: 6 };
  const nb = {};
  // sac mélangé: toutes les sortes passent avant qu'une revienne, jamais 2 fois dans les 3 derniers tirages
  const sortes = Object.keys(p.poids).filter(k => p.poids[k] > 0);
  let sac = [];
  const remplir = () => {
    sac = [];
    for (const k of sortes) for (let i = 0, n = Math.max(1, Math.round(p.poids[k])); i < n; i++) sac.push(k);
    for (let i = sac.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0; [sac[i], sac[j]] = [sac[j], sac[i]]; }
  };
  const recents = [];
  const permis = k => !recents.includes(k) && (nb[k] || 0) < (caps[k] || 99);
  const tirer = () => {
    if (!sac.length) remplir();
    let i = sac.findIndex(permis);
    if (i < 0) { remplir(); i = sac.findIndex(permis); }
    return i < 0 ? null : sac.splice(i, 1)[0];
  };
  let ex = 330;
  while (ex < L - 330) {
    ex += 95 + rng() * 85 - d * 25;
    if (isBusy(ex)) continue;
    const k = tirer();
    if (!k) continue;
    nb[k] = (nb[k] || 0) + 1;
    recents.push(k); if (recents.length > 2) recents.shift();
    const y = G(ex);
    switch (k) {
      case 'roche': lev.solids.push({ x0: ex - 6, x1: ex + 6, top: y - 7, spr: 'roche' }); break;
      case 'billot': lev.solids.push({ x0: ex - 9, x1: ex + 9, top: y - 5, spr: 'billot' }); break;
      case 'foin': {
        const two = rng() < .5;
        lev.solids.push({ x0: ex - 8, x1: ex + 8, top: y - 10, spr: 'foin' });
        if (two) { lev.solids.push({ x0: ex + 8, x1: ex + 24, top: G(ex + 16) - 10, spr: 'foin' }); lev.solids.push({ x0: ex + 8, x1: ex + 24, top: G(ex + 16) - 21, spr: 'foin' }); }
        for (let i = 0; i < 3; i++) lev.items.push({ k: 'fleur', x: ex - 4 + i * 6 + (two ? 12 : 0), y: (two ? G(ex + 16) - 21 : y - 10) - 9, v: i % 3 });
        break;
      }
      case 'nid': lev.zones.push({ k: 'nid', x0: ex - 5, x1: ex + 5 }); break;
      case 'boue': lev.zones.push({ k: 'boue', x0: ex - 14, x1: ex + 14 }); break;
      case 'ours': lev.enemies.push({ k: 'ours', x: ex, x0: ex, dir: -1, w: 20, h: 12 }); break;
      case 'oiseau': {
        const r = rng();
        lev.enemies.push({ k: 'oiseau', trig: ex - 210, mode: r < .4 ? 'bas' : r < .75 ? 'haut' : 'pique', active: false, w: 8, h: 5 });
        break;
      }
      case 'chien':
        lev.decor.push({ k: 'ferme', x: ex + 30 });
        lev.enemies.push({ k: 'chien', x: ex + 18, homeX: ex + 18, state: 'assis', w: 12, h: 7 });
        busy.push([ex - 20, ex + 70]);
        break;
      case 'mouffette': lev.enemies.push({ k: 'mouffette', x: ex, x0: ex, dir: -1, w: 12, h: 7 }); break;
      case 'vache': {
        const nv = rng() < .35 ? 2 : 1;
        for (let i = 0; i < nv; i++) lev.enemies.push({ k: 'vache', x: ex + i * 30, x0: ex + i * 30, dir: rng() < .5 ? -1 : 1, w: 18, h: 11 });
        busy.push([ex - 20, ex + nv * 30 + 20]);
        break;
      }
      case 'tracteur': {
        if (lev.enemies.some(e => e.k === 'tracteur')) break;
        let stop = Math.min(ex + 700, lev.didiX - 260);
        for (const c of lev.creeks) if (c.x0 > ex && c.x0 - 40 < stop) stop = c.x0 - 40;
        if (stop - ex < 250) break;
        const sol = { x0: ex - 12, x1: ex + 14, top: y - 15, spr: null, mobile: true };
        lev.solids.push(sol);
        lev.enemies.push({ k: 'tracteur', x: ex, stop, state: 'attend', sol, vx: 0, w: 26, h: 15 });
        busy.push([ex - 30, stop + 30]);
        break;
      }
      case 'pommier':
        lev.decor.push({ k: 'pommier', x: ex });
        lev.items.push({ k: 'pomme', x: ex - 3, y: y - 30 });
        if (rng() < .5) lev.items.push({ k: 'pomme', x: ex + 8, y: y - 7 });
        break;
      case 'fleurs': {
        const air = rng() < .5;
        for (let i = 0; i < 5; i++) {
          const fx = ex - 20 + i * 10;
          lev.items.push({ k: 'fleur', x: fx, y: G(fx) - 7 - (air ? Math.sin(i / 4 * Math.PI) * 26 : 0), v: (i + (rng() * 3 | 0)) % 3 });
        }
        break;
      }
    }
  }
  // bleuets (jauge de pet)
  const nbB = Math.round((4 + d * 2) * ((ev && ev.bleuets) || 1));
  for (let k = 0, tries = 0; k < nbB && tries < 200; tries++) {
    const bx = 320 + rng() * (L - 650);
    if (isBusy(bx)) continue;
    const air = rng() < .35, cnt = 2 + (rng() * 2 | 0);
    for (let i = 0; i < cnt; i++) {
      const fx = bx + i * 9;
      lev.items.push({ k: 'bleuet', x: fx, y: G(fx) - 6 - (air ? 22 : 0) });
    }
    busy.push([bx - 10, bx + cnt * 9 + 10]);
    k++;
  }
  // fleurs isolées et un coeur bonus
  for (let fx = 320; fx < L - 320; fx += 40 + rng() * 60) if (!isBusy(fx) && rng() < .35) lev.items.push({ k: 'fleur', x: fx, y: G(fx) - 7, v: (rng() * 3) | 0 });
  const hx = L * (.45 + rng() * .2);
  lev.items.push({ k: 'coeur', x: hx, y: G(hx) - 34 });
  decorate(lev, rng, isBusy);
  lev.parTime = L / 48 + 8;
  return lev;
}

function decorate(lev, rng, isBusy) {
  const L = lev.L;
  for (let x = 30; x < L; x += 150) lev.decor.push({ k: 'poteau', x });
  for (let x = 200; x < L - 200; x += 22 + rng() * 60) {
    if (isBusy && isBusy(x) && rng() < .7) continue;
    const r = rng();
    lev.decor.push({ k: r < .5 ? 'epinette' : r < .75 ? 'bouleau' : 'feuillu', x, s: rng() });
  }
  lev.decor.sort((a, b) => (a.k === 'poteau') - (b.k === 'poteau'));
}

function buildDown(up, seed) {
  const L = up.L, rng = rngOf(seed);
  const gy = new Float32Array(L + 2);
  for (let i = 0; i <= L + 1; i++) gy[i] = up.gy[clamp(L - i, 0, L)];
  const lev = { L, gy, gap: new Uint8Array(L + 2), creeks: [], solids: [], zones: [], items: [], enemies: [], decor: [], cps: [], down: true };
  const G = i => gy[clamp(Math.round(i), 0, L)];
  for (const c of up.creeks) lev.creeks.push({ x0: L - c.x1, x1: L - c.x0, g0: L - c.g1, g1: L - c.g0, y: c.y, intact: true });
  lev.didiX = L - up.didiX; lev.homeX = L - up.homeX;
  lev.decor.push({ k: 'maison', x: lev.didiX, style: 'didi' });
  lev.decor.push({ k: 'maison', x: lev.homeX, style: 'groloup' });
  lev.decor.push({ k: 'panneau', x: L - 150 });
  for (const dc of up.decor) if (dc.k === 'ferme' || dc.k === 'pommier') lev.decor.push({ k: dc.k, x: L - dc.x });
  // que du bon: des coeurs en arcs, des amis qui saluent
  for (let x = 260; x < L - 260; x += 110 + rng() * 90) {
    const r = rng(), cnt = 4 + (rng() * 3 | 0);
    for (let i = 0; i < cnt; i++) {
      const hx = x + i * 11;
      const yy = G(hx) - 8 - (r < .55 ? Math.sin(i / (cnt - 1) * Math.PI) * 30 : 0);
      lev.items.push({ k: 'coeurD', x: hx, y: yy });
    }
  }
  decorate(lev, rng, null);
  return lev;
}

// Le retour: la même route, parcourue de droite à gauche, sans aucune embûche
function buildDescent(up, seed) {
  const L = up.L, rng = rngOf(seed);
  const lev = {
    L, gy: up.gy, gap: new Uint8Array(L + 2), creeks: up.creeks.map(c => Object.assign({}, c, { intact: true })),
    solids: [], zones: [], items: [], enemies: [], decor: up.decor.slice(),
    cps: up.cps.map(c => ({ x: c.x, on: true })), down: true, didiX: up.didiX, homeX: up.homeX,
  };
  const G = i => up.gy[clamp(Math.round(i), 0, L)];
  for (let k = 0; k < 3; k++) {
    const bx = up.homeX + 200 + rng() * (up.didiX - up.homeX - 400);
    for (let i = 0; i < 2; i++) lev.items.push({ k: 'bleuet', x: bx - i * 9, y: G(bx - i * 9) - 6 });
  }
  for (let x = up.didiX - 120; x > up.homeX + 140; x -= 110 + rng() * 90) {
    const r = rng(), cnt = 4 + (rng() * 3 | 0);
    for (let i = 0; i < cnt; i++) {
      const hx = x - i * 11;
      lev.items.push({ k: 'coeurD', x: hx, y: G(hx) - 8 - (r < .55 ? Math.sin(i / (cnt - 1) * Math.PI) * 30 : 0) });
    }
  }
  return lev;
}

// ---------------- ÉTAT DU JEU ----------------
const G = {
  state: 'titre', t: 0, visite: 1, amour: 0, lev: null, pal: null, bg: null, saison: 'printemps',
  camX: 0, camY: 0, shake: 0, parts: [], pops: [], stats: null, totalFleurs: 0, menuSel: 0, pet: 0,
};
const inp = { left: false, right: false, jump: false, jumpP: false, toolP: false, boostP: false, okP: false, upP: false, downP: false, tap: null };
const P = {};
const HW = 6, PH = 20;

function gyAt(lev, x) {
  const i = clamp(Math.floor(x), 0, lev.L), f = clamp(x - i, 0, 1);
  return lerp(lev.gy[i], lev.gy[Math.min(i + 1, lev.L + 1)], f);
}
function hasGround(lev, x) { const i = Math.round(x); return i < 0 || i > lev.L || !lev.gap[i]; }
function slopeAt(lev, x) { return (gyAt(lev, x + 5) - gyAt(lev, x - 5)) / 10; }
function surfaceY(lev, x, y) {
  let best = hasGround(lev, x) ? gyAt(lev, x) : Infinity;
  for (const s of lev.solids) if (x + HW - 1 > s.x0 && x - HW + 1 < s.x1 && s.top >= y - 9 && s.top < best) best = s.top;
  return best;
}

function resetPlayer(x) {
  Object.assign(P, {
    x, y: gyAt(G.lev, x), vx: 0, vy: 0, onGround: true, inv: 0, stamina: 1, walking: false, phase: 0, angle: 0,
    coyote: 0, jumpBuf: 0, mud: false, stink: 0, nidCd: 0, bellCd: 0, maxX: x, sweatT: 0, noteT: 0, impatient: false, face: 1, ventT: 0, boostT: 0, petPuffT: 0,
    wheelie: false, wheelieT: 0, wheelieSec: 0, wheelieA: 0,
  });
}

function addAmour(d, x, y, label) {
  const before = G.amour;
  G.amour = clamp(G.amour + d, 0, 100);
  if (G.stats) G.stats.delta += G.amour - before;
  if (label) pop(label, x, y, d < 0 ? '#ff6a7a' : '#ffb0c8');
  if (d <= -1) Sound.fx('baisse');
}
function pop(txt, x, y, col, size) {
  G.pops.push({ txt, x: x == null ? P.x : x, y: y == null ? P.y - 34 : y, t: 0, col: col || '#ffffff', size: size || 6 });
}
function part(kind, x, y, vx, vy, life, col) { G.parts.push({ kind, x, y, vx, vy, life, max: life, col }); }
function burst(x, y, n, col, spd, kind) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (spd || 60) * (.4 + Math.random() * .8);
    part(kind || 'px', x, y, Math.cos(a) * s, Math.sin(a) * s - 30, .5 + Math.random() * .5, col);
  }
}
const OUILLE = ['Flûte!', 'Ouille!', 'Flûte!', 'Aïe!', 'Ayoye!', 'Flûte de flûte!', 'Oups!'];

function hurt(e) {
  if (P.inv > 0) return;
  P.inv = 1.6; P.vx = -95; P.vy = -170; P.onGround = false;
  G.stats.plantes++;
  const cause = e && e.k ? e.k : 'autre'; G.stats.causes[cause] = (G.stats.causes[cause] || 0) + 1;
  addAmour(AMOUR.plante, P.x, P.y - 40, '-' + Math.abs(AMOUR.plante) + ' amour');
  pop(OUILLE[(Math.random() * OUILLE.length) | 0], P.x, P.y - 30, '#ffe060', 7);
  Sound.fx('aie'); G.shake = .3; vibrer(90);
  burst(P.x, P.y - 12, 10, '#ffffff', 80);
}

function ebox(e) {
  if (e.k === 'oiseau') return [e.x - 4, e.y - 3, e.x + 4, e.y + 3];
  return [e.x - e.w / 2, e.y - e.h, e.x + e.w / 2, e.y];
}
function pbox() { return [P.x - HW, P.y - PH, P.x + HW, P.y - 1]; }
function overlap(a, b) { return a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1]; }

function sonnette() {
  if (P.bellCd > 0) return;
  P.bellCd = 2.2; Sound.fx('dring');
  pop('Dring dring!', P.x + 8, P.y - 36, '#ffe060');
  if (G.lev.down) { for (let i = 0; i < 4; i++) part('note', P.x, P.y - 24, (Math.random() - .5) * 40, -40 - Math.random() * 30, 1.4); return; }
  for (const e of G.lev.enemies) {
    if (e.gone || e.state === 'fuit') continue;
    const dx = Math.abs(e.x - P.x);
    if (e.k === 'oiseau' && e.active && dx < 140) { e.state = 'fuit'; part('plume', e.x, e.y, 20, -20, 1, '#222'); }
    else if (e.k === 'chien' && dx < 140 && e.state !== 'fini') { e.state = e.state === 'assis' ? 'fini' : 'fuit'; pop('Kaï kaï!', e.x, e.y - 14); }
    else if (e.k === 'ours' && dx < 120) {
      if (Math.random() < .5) { e.state = 'fuit'; compter('ours', 10, 'dompteur'); if (G.partie) G.partie.ours = (G.partie.ours || 0) + 1; pop("L'ours se sauve!", e.x, e.y - 20); }
      else { pop("L'ours s'en fiche!", e.x, e.y - 20, '#ffb060'); e.mad = 1.5; }
    }
    else if (e.k === 'vache' && dx < 100) pop('Meuh?', e.x, e.y - 18, '#ffffff', 5);
    else if (e.k === 'tracteur' && e.state === 'roule' && dx < 140) { e.state = 'part'; pop('Il te laisse passer!', e.x, e.y - 30, '#ffe060', 5); }
    else if (e.k === 'mouffette' && dx < 70) {
      P.stink = 3.5; G.stats.mouffette = true; Sound.fx('pschit'); badge('parfum');
      pop('Faut pas sonner une mouffette!', P.x, P.y - 44, '#a8ff80', 5);
    }
  }
}

const PROUTS = ['Whoosh!', 'Fiou!', 'Zoum!', 'Swoosh!', 'Vent dans le dos!'];
function peter() {
  if (P.boostT > 0) return;
  if (G.pet < PET.cout) { pop('Pas assez de bleuets!', P.x, P.y - 40, '#c8b4ff', 4.5); return; }
  G.pet -= PET.cout; P.boostT = PET.duree; P.walking = false;
  P.stamina = Math.max(P.stamina, .3);
  G.stats.pets = (G.stats.pets || 0) + 1;
  Sound.fx('pet'); G.shake = .15; vibrer([30, 40, 30]); compter('boosts', 10, 'ventdos');
  pop(PROUTS[(Math.random() * PROUTS.length) | 0], P.x - (G.lev.down ? -1 : 1) * 18, P.y - 30, '#d8ff9a', 7);
  for (let i = 0; i < 10; i++) part('pet', P.x - (G.lev.down ? -1 : 1) * 12, P.y - 10, (G.lev.down ? 1 : -1) * (20 + Math.random() * 40), (Math.random() - .5) * 30, 1.1);
}
function updatePlayer(dt) {
  const lev = G.lev, down = lev.down, fwd = down ? -1 : 1;
  const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0), rel = dir * fwd;
  const up = -slopeAt(lev, P.x) * fwd;
  P.inv = Math.max(0, P.inv - dt); P.stink = Math.max(0, P.stink - dt);
  P.nidCd = Math.max(0, P.nidCd - dt); P.bellCd = Math.max(0, P.bellCd - dt);
  P.jumpBuf = Math.max(0, P.jumpBuf - dt);
  if (inp.jumpP) P.jumpBuf = .13;
  if (inp.toolP) sonnette();
  if (inp.boostP) peter();
  if (P.boostT > 0) {
    P.boostT -= dt; P.walking = false;
    P.petPuffT -= dt;
    if (P.petPuffT <= 0) {
      P.petPuffT = .05;
      part('pet', P.x - (down ? -1 : 1) * 13, P.y - 10 + (Math.random() - .5) * 4, -P.vx * .15 + (Math.random() - .5) * 12, -6 - Math.random() * 8, .9);
    }
  }

  // zones: nids-de-poule et boue
  P.mud = false;
  if (!down && P.onGround) for (const z of lev.zones) {
    if (P.x > z.x0 && P.x < z.x1) {
      if (z.k === 'boue') { P.mud = true; if (Math.random() < .3) part('px', P.x - 6, P.y - 1, -20 - Math.random() * 30, -40 - Math.random() * 40, .5, '#5a3a1e'); }
      else if (z.k === 'nid' && P.nidCd <= 0 && Math.abs(P.vx) > 15) {
        P.nidCd = .8; P.vx *= .3; P.vy = -110; P.onGround = false; G.shake = .25; Sound.fx('nid');
        G.stats.nids++; addAmour(-1, P.x, P.y - 40, '-1 amour');
        pop('Nid-de-poule!', P.x, P.y - 30, '#ffe060');
      }
    }
  }

  // wheelie: vent + flèche arrière dans la descente
  if (down) {
    if (!P.wheelie && P.boostT > 0 && rel < 0) {
      P.wheelie = true; P.wheelieT = 0; P.wheelieSec = 0;
      pop('Wheelie!', P.x, P.y - 40, '#ffe060', 7); Sound.fx('rebond');
    }
    if (P.wheelie) {
      if (rel >= 0) {
        if (P.wheelieT >= 1) pop('Wheelie de ' + P.wheelieT.toFixed(1) + ' s!', P.x, P.y - 40, '#ffe060', 5);
        P.wheelie = false;
      } else {
        P.wheelieT += dt; if (G.partie) G.partie.wheelie = (G.partie.wheelie || 0) + dt;
        if (P.wheelieT >= P.wheelieSec + 1) { P.wheelieSec++; pop('+10', P.x + 10, P.y - 34, '#b4ff9a', 5); }
        if (P.wheelieT >= 3) badge('wheelie');
      }
    }
  }
  P.wheelieA = approach(P.wheelieA || 0, P.wheelie ? .5 : 0, dt * (P.wheelie ? 3 : 4));
  // wheelie devant la maison de Didi (elle est encore à l'écran): elle lui envoie un bec
  if (P.wheelie && G.lev.down && G.state === 'descend' && !G.becVu) {
    const dx = G.lev.didiX + 10 - G.camX;
    if (dx > 0 && dx < W - 10) {
      G.becVu = true; Sound.fx('coeur');
      const bx = G.lev.didiX + 16, by = gyAt(G.lev, G.lev.didiX) - 20;
      pop('Mwah!', bx, by - 14, '#ffb0d8', 6);
      for (let k = 0; k < 6; k++) part('heart', bx, by, (P.x - bx) * (.6 + Math.random() * .3), -20 - Math.random() * 30, 1.4);
      addAmour(1, P.x, P.y - 48, 'Un bec de Didi! +1');
    }
  }

  if (P.onGround) {
    if (down) {
      let target = clamp(128 + (-up) * 380, 108, 192);
      if (rel > 0) target += 35; if (rel < 0 && !P.wheelie) target = 60;
      if (P.boostT > 0) target += 75;
      P.vx = approach(P.vx, target * fwd, (P.boostT > 0 ? 420 : 170) * dt);
    } else if (P.walking) {
      P.vx = approach(P.vx, dir > 0 ? 28 : dir < 0 ? -22 : 0, 140 * dt);
      P.stamina = Math.min(1, P.stamina + .16 * dt);
      if (P.stamina >= .4) { P.walking = false; pop('Repartons!', P.x, P.y - 36); }
    } else {
      let acc;
      const mods = (G.event && G.event.mods) || {};
      if (dir > 0) {
        acc = 185 * (mods.pedal || 1) - 430 * up - 1.9 * P.vx;
        if (up > .02) P.stamina -= (.025 + up * .42) * (mods.drain || 1) * dt; else P.stamina = Math.min(1, P.stamina + .06 * dt);
      } else if (dir < 0) {
        acc = -170 - 400 * up - 1.9 * P.vx; P.stamina = Math.min(1, P.stamina + .1 * dt);
      } else {
        P.stamina = Math.min(1, P.stamina + .22 * dt);
        acc = up > -.02 ? -Math.sign(P.vx) * Math.min(Math.abs(P.vx) / dt, 240) : -400 * up - P.vx;
      }
      if (P.boostT > 0) { acc = (165 - P.vx) * 7; P.stamina = Math.min(1, P.stamina + .05 * dt); }
      P.vx += acc * dt;
      if (P.vx < -55) P.vx = -55;
      let cap = 999; if (P.mud) cap = 30; if (P.stink > 0) cap = Math.min(cap, 60);
      if (P.boostT > 0) cap = 999;
      if (P.vx > cap) P.vx = approach(P.vx, cap, 500 * dt);
      if (P.stamina <= 0) {
        P.stamina = 0; P.walking = true;
        pop('À bout de souffle!', P.x, P.y - 36, '#9ad8ff');
      }
    }
    if (P.jumpBuf > 0 && !P.walking) {
      P.vy = -240; P.onGround = false; P.jumpBuf = 0; P.coyote = 0; Sound.fx('saut');
    }
  } else {
    if (P.coyote > 0 && P.jumpBuf > 0 && !P.walking) { P.vy = -240; P.jumpBuf = 0; P.coyote = 0; Sound.fx('saut'); }
    P.vx += dir * (down ? 70 : 120) * dt;
    P.vx = down ? clamp(P.vx, P.boostT > 0 ? -275 : -240, -50) : clamp(P.vx, -60, P.boostT > 0 ? 170 : 105);
    P.noCut = Math.max(0, (P.noCut || 0) - dt);
    if (!inp.jump && P.vy < -100 && P.noCut <= 0) P.vy = -100;
  }

  // déplacement horizontal + collisions latérales
  const prevX = P.x;
  P.x += P.vx * dt;
  if (P.x < 24) { P.x = 24; P.vx = 0; }
  for (const s of lev.solids) {
    if (P.x + HW > s.x0 && P.x - HW < s.x1 && P.y > s.top + 3 && P.y - PH < s.top + 30) {
      P.x = prevX < (s.x0 + s.x1) / 2 ? s.x0 - HW : s.x1 + HW;
      P.vx = 0;
    }
  }
  // vertical
  if (P.onGround) {
    const sy = surfaceY(lev, P.x, P.y);
    if (sy !== Infinity && sy - P.y < 8 && sy - P.y > -10) { P.y = sy; P.vy = 0; }
    else { P.onGround = false; P.coyote = .09; }
  } else {
    P.coyote -= dt;
    P.vy = Math.min(P.vy + 720 * dt, 420);
    const ny = P.y + P.vy * dt;
    let land = Infinity;
    if (P.vy >= 0) {
      if (hasGround(lev, P.x)) { const g = gyAt(lev, P.x); if (ny >= g && P.y <= g + 12) land = g; }
      for (const s of lev.solids) if (P.x + HW - 2 > s.x0 && P.x - HW + 2 < s.x1 && P.y <= s.top + 1 && ny >= s.top) land = Math.min(land, s.top);
    }
    if (land !== Infinity) {
      P.y = land; P.vy = 0; P.onGround = true;
      for (let i = 0; i < 4; i++) part('px', P.x + (Math.random() - .5) * 16, P.y - 1, (Math.random() - .5) * 40, -20 - Math.random() * 20, .4, G.pal.roadL);
    } else P.y = ny;
  }
  // ruisseau: une fois sous le niveau du pont, il tombe tout droit dans l'eau
  const cr = lev.creeks.find(c => !c.intact && P.x > c.g0 - HW && P.x < c.g1 + HW);
  if (cr && !P.onGround && P.y > gyAt(lev, cr.g0) + 2) {
    P.x = clamp(P.x, cr.g0 + 1, cr.g1 - 1);
    if (P.y > gyAt(lev, cr.g0) + 18) plouf(cr);
  } else if (!P.onGround && P.y > gyAt(lev, P.x) + 30) {
    // filet de sécurité: jamais sous la route

    if (c2 && !c2.intact) plouf(c2); else { resetPlayerAt(Math.max(30, P.x - 40)); P.inv = 1; }
  }
  // angle du vélo selon la pente
  const targetA = P.onGround ? Math.atan(slopeAt(lev, P.x)) : -clamp(P.vy / 900, -.25, .3) * fwd + Math.atan(slopeAt(lev, P.x)) * .5;
  P.angle = lerp(P.angle, targetA, Math.min(1, dt * 12));
  P.phase += Math.abs(P.vx) * dt / (P.walking ? 5 : 4.2);

  if (!down && P.x > P.maxX) {
    addAmour((P.x - P.maxX) / (lev.didiX - 110) * AMOUR.trajet);
    P.maxX = P.x;
  }
  // effets d'ambiance
  if (!down && P.onGround && !P.walking && dir > 0 && up > .1) {
    P.sweatT -= dt;
    if (P.sweatT <= 0) { P.sweatT = .45; part('sueur', P.x + 2, P.y - 28, -25 - Math.random() * 20, -30, .6); }
  }
  if (down) {
    P.noteT -= dt;
    if (P.noteT <= 0) { P.noteT = .55; part('note', P.x - 4, P.y - 32, (30 + Math.random() * 20) * -fwd, -25 - Math.random() * 15, 1.3); }
    P.ventT -= dt;
    if (P.ventT <= 0) { P.ventT = .07; part('vent', P.x - fwd * (12 + Math.random() * 14), P.y - 6 - Math.random() * 26, P.vx * .25, 0, .22, 'rgba(255,255,255,.7)'); }
  }
  if (P.stink > 0 && Math.random() < .4) part('px', P.x + (Math.random() - .5) * 14, P.y - 10 - Math.random() * 14, -10, -20, .7, '#8ad860');
}
function plouf(c) {

function resetPlayerAt(x) {
  P.x = x; P.y = gyAt(G.lev, x); P.vx = 0; P.vy = 0; P.onGround = true; P.angle = 0;
}

function updateEnemies(dt) {
  const lev = G.lev;
  for (const e of lev.enemies) {
    if (e.gone) continue;
    e.anim = (e.anim || 0);
    if (e.x < G.camX - 400 || e.x > G.camX + W + 400) { if (e.k !== 'oiseau') continue; }
    switch (e.k) {
      case 'ours': {
        if (e.state === 'fuit') { e.x -= 130 * dt; e.anim += dt * 14; if (e.x < G.camX - 40) e.gone = true; break; }
        const dx = P.x - e.x;
        e.mad = Math.max(0, (e.mad || 0) - dt);
        if (dx < 0 && dx > -160) {
          e.dir = -1; e.spd = e.mad > 0 ? 55 : 30;
          if (!e.growled) { e.growled = true; Sound.fx('grogne'); pop('GRRR!', e.x, e.y - 20, '#ffb060', 7); }
        } else {
          e.spd = 14;
          if (Math.abs(e.x - e.x0) > 36) e.dir = -Math.sign(e.x - e.x0);
        }
        const nx = e.x + e.dir * e.spd * dt;
        if (hasGround(lev, nx + e.dir * 12)) e.x = nx; else e.dir *= -1;
        e.anim += dt * e.spd * .25;
        e.y = gyAt(lev, e.x);
        break;
      }
      case 'oiseau': {
        if (!e.active) {
          if (P.x > e.trig) {
            e.active = true; e.x = G.camX + W + 12; e.t = 0;
            e.baseH = e.mode === 'bas' ? 12 : e.mode === 'haut' ? 31 : 44;
            Sound.fx('croa');
          } else break;
        }
        e.anim += dt * 9;
        if (e.state === 'fuit') { e.x += 50 * dt; e.y -= 100 * dt; if (e.y < G.camY - 30) e.gone = true; break; }
        e.t += dt; e.x -= 74 * dt;
        let y = gyAt(lev, e.x) - e.baseH + Math.sin(e.t * 5) * 2.5;
        if (e.mode === 'pique') {
          const dxp = e.x - P.x;
          if (dxp < 85) e.dive = Math.min(1, (e.dive || 0) + dt * 1.5);
          if (e.dive) y = lerp(y, P.y - 14, Math.sin(e.dive * Math.PI));
        }
        e.y = y;
        if (e.x < G.camX - 30) e.gone = true;
        break;
      }
      case 'chien': {
        e.barkT = (e.barkT || 0) - dt;
        if (e.state === 'assis') { if (P.x > e.homeX - 170 && P.x < e.homeX - 20) e.state = 'court'; }
        else if (e.state === 'court') {
          e.x -= 98 * dt; e.anim += dt * 14;
          if (e.barkT <= 0) { e.barkT = .5; Sound.fx('wouf'); pop('Wouf!', e.x, e.y - 14, '#ffffff', 5); }
          if (e.x < P.x - 70) e.state = 'retour';
        } else if (e.state === 'retour' || e.state === 'fuit') {
          e.x += (e.state === 'fuit' ? 120 : 60) * dt; e.anim += dt * 12;
          if (e.x >= e.homeX) { e.x = e.homeX; e.state = 'fini'; }
        }
        e.y = gyAt(lev, e.x);
        break;
      }
      case 'vache': {
        e.x += e.dir * 5 * dt; e.anim += dt * 2.5;
        if (Math.abs(e.x - e.x0) > 12) e.dir = -Math.sign(e.x - e.x0);
        e.y = gyAt(lev, e.x);
        if (!e.meuh && Math.abs(P.x - e.x) < 90) { e.meuh = true; Sound.fx('meuh'); pop('Meuh!', e.x, e.y - 18, '#ffffff', 5); }
        break;
      }
      case 'tracteur': {
        const s = e.sol;
        if (e.state === 'attend' && P.x > e.x - 260) { e.state = 'roule'; e.vx = 22; }
        if (e.state === 'roule') {
          e.x += e.vx * dt; e.anim += dt * 6; e.puttT = (e.puttT || 0) - dt;
          if (e.puttT <= 0) { e.puttT = .35; part('pet', e.x + 10, e.y - 22, -4, -18, .9); if (Math.abs(P.x - e.x) < 160) Sound.fx('putt'); }
          if (e.x >= e.stop) { e.state = 'part'; pop('Bonne journée!', e.x, e.y - 30, '#ffffff', 5); }
        }
        if (e.state === 'part') { e.fade = (e.fade || 0) + dt; e.x += 30 * dt; if (e.fade > 1) { e.gone = true; s.x0 = s.x1 = -9999; break; } }
        e.y = gyAt(lev, e.x);
        const onTop = P.onGround && Math.abs(P.y - s.top) < 1.5 && P.x + HW > s.x0 && P.x - HW < s.x1;
        s.x0 = e.x - 12; s.x1 = e.x + 14; s.top = e.y - 15;
        if (onTop && !e.gone) { P.x += e.vx * dt; P.y = s.top; e.surT = (e.surT || 0) + dt; if (e.surT > .6) badge('passager'); }
        if (P.onGround && P.y > s.top + 3 && P.x - HW < s.x1 && P.x + HW > s.x0 && P.x > e.x) P.x = s.x1 + HW;
        e.bloqueT = Math.max(0, (e.bloqueT || 0) - dt);
        if (inp.right && P.onGround && P.y > s.top + 3 && Math.abs(P.x + HW - s.x0) < 2 && e.bloqueT <= 0) {
          e.bloqueT = 3; pop(['Envoye, le tracteur!', 'Tasse-toi un peu!', 'Sonne pour qu\'il se tasse!'][(Math.random() * 3) | 0], P.x, P.y - 36, '#ffe060', 4.5);
        }
        continue;
      }
      case 'mouffette': {
        e.dir = e.dir || -1;
        e.x += e.dir * 8 * dt; e.anim += dt * 3;
        if (Math.abs(e.x - e.x0) > 20) e.dir = -Math.sign(e.x - e.x0);
        e.y = gyAt(lev, e.x);
        break;
      }
    }
    // collisions avec Groloup
    if (e.gone || e.state === 'fuit' || e.state === 'fini' || e.state === 'assis' || (e.k === 'oiseau' && !e.active)) continue;
    const b = ebox(e);
    if (!overlap(pbox(), b)) continue;
    if (P.vy > 30 && P.y - b[1] < 9) {
      P.vy = -265; P.onGround = false; Sound.fx('rebond'); P.noCut = .3;
      burst(e.x, b[1], 6, '#ffffff', 60);
      if (e.k === 'mouffette') {
        P.stink = 3.5; G.stats.mouffette = true; Sound.fx('pschit'); badge('parfum');
        pop('Pschiiit!', e.x, e.y - 18, '#a8ff80', 7);
      } else if (e.k === 'vache') {
        P.vy = -330; Sound.fx('meuh'); badge('rodeo');
        pop(['Meuh!', 'Rodéo!', 'Hiii-ha!'][(Math.random() * 3) | 0], e.x, e.y - 20, '#ffffff', 6);
      } else {
        if (e.k === 'ours') compter('ours', 10, 'dompteur'); if (G.partie) G.partie.ours = (G.partie.ours || 0) + 1;
        e.state = 'fuit';
        if (e.k === 'ours') pop("L'ours se sauve!", e.x, e.y - 22);
        if (e.k === 'chien') pop('Kaï kaï!', e.x, e.y - 14);
        if (e.k === 'oiseau') for (let i = 0; i < 4; i++) part('plume', e.x, e.y, (Math.random() - .5) * 60, -Math.random() * 40, 1, '#222');
      }
    } else if (P.inv <= 0) {
      if (e.k === 'mouffette') { P.stink = 3.5; G.stats.mouffette = true; Sound.fx('pschit'); badge('parfum'); }
      if (e.k === 'vache') { Sound.fx('meuh'); pop('Meuh!', e.x, e.y - 18, '#ffffff', 6); }
      hurt(e);
    }
  }
}

function updateItems(dt) {
  const lev = G.lev, pb = pbox();
  for (const it of lev.items) {
    if (it.got) continue;
    if (Math.abs(it.x - P.x) > 30) continue;
    if (!overlap(pb, [it.x - 4, it.y - 4, it.x + 4, it.y + 4])) continue;
    it.got = true;
    switch (it.k) {
      case 'fleur':
        G.stats.fleurs++; addAmour(AMOUR.fleur); Sound.fx('fleur');
        if (G.totalFleurs + G.stats.fleurs >= 100) badge('jardinier');
        burst(it.x, it.y, 5, ['#ffffff', '#b48aff', '#ff8ac0'][it.v || 0], 40);
        break;

    if (it.k === 'fleur') spr(SPR.fleurs[it.v || 0], X - 2, Y - 3 + (bob > .6 ? -1 : 0));
    else if (it.k === 'pomme') spr(SPR.pomme, X - 2, Y - 2);
    else if (it.k === 'bleuet') spr(SPR.bleuet, X - 2, Y - 2 + (bob > .3 ? -1 : 0));
    else spr(SPR.heart, X - 3, Y - 3 + Math.round(bob));
  }
  if (G.state === 'monte' || G.state === 'arrivee' || G.state === 'descend' || G.state === 'retour') {
    const dx = lev.didiX + 10 - cx;
    const wave = (G.state === 'arrivee' && G.arr && G.arr.wave) || G.state === 'descend';
    const img = wave ? SPR.didiWave[((G.t * 5) | 0) % 2] : SPR.didi;
    const jump = G.arr && G.arr.jump ? Math.round(Math.abs(Math.sin(G.t * 9)) * -4) : 0;
    if (dx > -20 && dx < W + 20) spr(img, dx, Math.round(gyAt(lev, lev.didiX) - cy) - 22 + jump);
  }
  for (const e of lev.enemies) {
    if (e.gone || (e.k === 'oiseau' && !e.active)) continue;
    const X = e.x - cx, Y = e.y - cy;
    if (X < -30 || X > W + 30) continue;
    const f = (e.anim | 0) % 2;
    if (e.k === 'ours') spr(SPR.ours[f], X - 11, Y - 13, e.dir > 0 && e.state !== 'fuit');
    else if (e.k === 'oiseau') spr(SPR.oiseau[f], X - 5, Y - 3, e.state === 'fuit');
    else if (e.k === 'chien') spr(SPR.chien[e.state === 'court' || e.state === 'retour' || e.state === 'fuit' ? f : 0], X - 7, Y - 8, e.state === 'retour' || e.state === 'fuit' || e.state === 'fini');
    else if (e.k === 'mouffette') spr(SPR.mouffette[f], X - 7, Y - 8, e.dir > 0);
    else if (e.k === 'vache') spr(SPR.vache[f], X - 10, Y - 11, e.dir > 0);
    else if (e.k === 'tracteur') { if (e.fade) g.globalAlpha = Math.max(0, 1 - e.fade); spr(SPR.tracteur[f], X - 15, Y - 23); g.globalAlpha = 1; }
  }
}

function drawPlayer(cx, cy) {
  if (P.hidden) return;
  if (P.inv > 0 && ((P.inv * 14) | 0) % 2) return;
  let img;
  if (P.pose === 'debout') img = SPR.stand;
  else if (P.walking) img = SPR.walk[(P.phase | 0) % 6];
  else if (G.lev.down) img = SPR.happy[(P.phase | 0) % 8];
  else img = SPR.effort[(P.phase | 0) % 8];
  const wa = P.wheelieA || 0;
  if (wa > .01) {
    g.save(); g.translate(Math.round(P.x - cx - P.face * 9), Math.round(P.y - cy)); g.rotate(P.angle - P.face * wa);
    if (P.face < 0) g.scale(-1, 1);
    g.drawImage(img, -7, -36); g.restore();
  } else {
    g.save(); g.translate(Math.round(P.x - cx), Math.round(P.y - cy)); g.rotate(P.angle);
    if (P.face < 0) g.scale(-1, 1);
    g.drawImage(img, -16, -36); g.restore();
  }
  if (P.stink > 0 && ((G.t * 6) | 0) % 2) rect(P.x - cx - 8, P.y - cy - 30, 1, 1, '#8ad860');
}

function drawParticles(cx, cy) {
  for (const p of G.parts) {
    const X = Math.round(p.x - cx), Y = Math.round(p.y - cy);
    if (X < -10 || X > W + 10 || Y < -10 || Y > H + 10) continue;
    switch (p.kind) {
      case 'px': case 'plume': case 'fw': rect(X, Y, 1, 1, p.col); break;
      case 'feuille': case 'petale': rect(X, Y, 2, 1, p.col); break;
      case 'vent': rect(X - 2, Y, 5, 1, p.col); break;
      case 'pet': { const r = 1 + Math.round((1 - p.life / p.max) * 3); DISC(g, X, Y, r, r, p.life / p.max > .5 ? 'rgba(190,220,150,.7)' : 'rgba(200,215,170,.45)'); break; }
      case 'pluie': rect(X, Y, 1, 3, 'rgba(190,215,240,.75)'); break;
      case 'sueur': spr(SPR.sueur, X, Y); break;
      case 'note': spr(SPR.note, X, Y); break;
      case 'heart': spr(SPR.heart, X - 3, Y - 3); break;
      case 'luciole': if (Math.sin(p.life * 8 + p.x) > 0) rect(X, Y, 1, 1, p.col); break;
      case 'papillon': spr(SPR.papillon[((G.t * 8) | 0) % 2], X, Y + Math.round(Math.sin(G.t * 5 + p.x) * 2)); break;
    }
  }
  for (const q of G.pops) txt(q.txt, q.x - cx, q.y - cy, q.size, q.col, 'center');
}

function drawWorld() {
  let cx = Math.round(G.camX), cy = Math.round(G.camY);
  if (G.shake > 0) { cx += Math.round((Math.random() - .5) * 4); cy += Math.round((Math.random() - .5) * 4); }
  drawSky(cx, cy);
  drawDecor(cx, cy);
  drawGround(cx, cy);
  drawEntities(cx, cy);
  drawPlayer(cx, cy);
  if (G.state === 'arrivee' && G.arr && G.arr.bouquet > 0 && P.pose === 'debout') drawBouquetArrivee(cx, cy);
  drawParticles(cx, cy);
  if (G.pal.night) { g.fillStyle = 'rgba(10,14,50,.18)'; g.fillRect(0, 0, W, H); }
  if (G.event && G.event.ambient === 'pluie' && G.state !== 'titre') { g.fillStyle = 'rgba(50,60,80,.16)'; g.fillRect(0, 0, W, H); }
}

// Bouquet de fleurs des champs: sa grosseur suit le nombre de fleurs cueillies
const COUL_FLEURS = ['#ffffff', '#ffe060', '#ff8ac0', '#b48aff', '#ff6a5a', '#8ad8ff'];
function drawBouquet(x, y, n) {
  x = Math.round(x); y = Math.round(y);
  const tier = n >= 25 ? 4 : n >= 15 ? 3 : n >= 10 ? 2 : n >= 5 ? 1 : 0;
  const tetes = [3, 4, 6, 9, 13][tier], haut = [5, 5, 6, 8, 10][tier], large = [3, 4, 6, 9, 12][tier];
  const tops = [];
  for (let i = 0; i < tetes; i++) {
    const u = tetes === 1 ? 0 : i / (tetes - 1) - .5;
    const hx = x + Math.round(u * large + ((i * 7) % 3 - 1) * .5);
    const hy = y - 3 - haut + Math.round(u * u * 4 * (haut * .45)) - (i % 2) * Math.min(2, tier);
    tops.push([hx, hy, COUL_FLEURS[(i * 5 + n) % COUL_FLEURS.length]]);
  }
  // tiges
  for (const [hx, hy] of tops) { g.strokeStyle = '#3a8a3a'; g.lineWidth = 1; g.beginPath(); g.moveTo(x + .5, y - 2); g.lineTo(hx + .5, hy + 1); g.stroke(); }
  // fleurs (les plus hautes en arrière)
  tops.sort((a, b) => a[1] - b[1]);
  for (const [hx, hy, c] of tops) {
    rect(hx - 1, hy, 3, 1, c); rect(hx, hy - 1, 1, 3, c);
    rect(hx, hy, 1, 1, c === '#ffe060' ? '#d0782a' : '#ffe060');
  }
  // papier pis ruban
  const cone = 1 + Math.min(3, tier);
  for (let k = 0; k < 4; k++) { const w = Math.max(1, Math.round((k + 1) / 4 * cone)); rect(x - w + 1, y - k, w * 2 - 1, 1, k % 2 ? '#f4efe2' : '#e2d8c4'); }
  rect(x - Math.max(0, cone - 2), y - 2, Math.max(1, cone * 2 - 3), 1, '#e04a6a');
}
function drawBouquetArrivee(cx, cy) {
  const A = G.arr, lev = G.lev;
  const jump = A.jump ? Math.round(Math.abs(Math.sin(G.t * 9)) * -4) : 0;
  const ax = P.x + 3, ay = P.y - 11;                                   // dans la main de Groloup
  const bx = lev.didiX + 16, by = gyAt(lev, lev.didiX) - 10 + jump;   // dans les mains de Didi
  const k = A.don == null ? 0 : clamp(A.don / .7, 0, 1);
  const e = k * k * (3 - 2 * k);
  drawBouquet(lerp(ax, bx, e) - cx, lerp(ay, by, e) - Math.sin(Math.PI * e) * 5 - cy, A.bouquet);
}

// ---------------- SCÈNES ----------------

function musicNo() { return 1 + clamp(Math.floor(G.amour / 24), 0, 3); }
function setState(s) { G.state = s; G.stateT = 0; }
function setLevel(lev) {
  G.lev = lev;
  let m = -Infinity; for (let i = 0; i <= lev.L; i++) if (lev.gy[i] > m) m = lev.gy[i];
  G.camYBottom = m - 112;
}

function startVisit() {
  G.saison = SAISONS[(G.visite - 1) % 4];
  G.pal = PAL[G.saison]; G.bg = buildBackground(G.pal);
  G.seed = (Math.random() * 1e9) | 0;
  G.event = G.visite === 1 ? piocher('evenements', EVENEMENTS, e => e.id === 'calme') : piocher('evenements', EVENEMENTS, e => !e.saisons || e.saisons.includes(G.saison));
  G.up = buildUp(G.visite, G.seed, G.event);
  setLevel(G.up);
  G.stats = { fleurs: 0, plantes: 0, nids: 0, coeurs: 0, t: 0, mouffette: false, delta: 0, amourDebut: G.amour, pets: 0, causes: {} };
  G.parts = []; G.pops = []; G.arr = null;
  resetPlayer(G.lev.homeX + 40); P.pose = null; P.hidden = false;
  G.camX = 0; G.camY = gyAt(G.lev, P.x) - 112;
  G.tagline = piocher('taglines', TAGLINES);
  setState('intro');
  Sound.play('amour');
}

function startArrival() {
  setState('arrivee');
  const st = G.stats, lev = G.lev;
  const A = G.arr = { phase: 'roule', lines: [], i: 0, shown: 0, wave: true, jump: false, stopX: lev.didiX - 30 };
  Sound.fx('arrivee');
  if (st.plantes === 0) { badge('sansfaute'); G.partie = G.partie || {}; G.partie.sansFaute = (G.partie.sansFaute || 0) + 1; }
  // le bouquet: Groloup le tient en arrivant, pis il le donne à Didi (plus il y a de fleurs, plus il est gros)
  A.bouquet = st.fleurs; A.donIdx = 0; A.don = null;
  if (G.amour >= AMOUR.demande) {
    A.demande = true;
    A.lines = [
      ['Groloup', "Didi... j'ai monté le rang 14 " + G.visite + ' fois pour toi.'],
      ['Groloup', 'Pis je le monterais encore toute ma vie.'],
      ['Groloup', 'Didi... veux-tu me marier?'],
      ['Didi', '...'],
      ['Didi', 'Ben voyons donc, Groloup...'],
      ['Didi', 'OUI! OUI! OUI!'],
    ];
    return;
  }
  const L = A.lines;
  addAmour(1);
  G.vus = G.vus || {};
  const ctx = { soir: G.saison === 'nuit', evenement: G.event ? G.event.id : null, encore: G.totalFleurs > 0, nb: 0 };
  const auj = ctx.soir ? 'à soir' : "aujourd'hui";
  const ajouter = ex => { if (ex) for (const l of lignesDe(ex)) L.push([l[0], l[1].replace('{auj}', auj)]); };
  const tirer = (nom, pool, extra) => piocher(nom, pool, x => echangeOk(x, Object.assign({}, ctx, extra || {})));
  // 1) salutation de Groloup
  if (G.visite === 1) L.push(['Groloup', piocher('premier', DIALOGUES.premier)]);
  else ajouter(tirer('salut', DIALOGUES.salut));
  // 2) le sujet principal de la visite (un seul, le plus marquant), en échange qui se répond
  const causes = st.causes || {};
  let sujet = null, ex = null;
  if (st.mouffette) { ex = tirer('mouffette', DIALOGUES.mouffette); sujet = 'odeur'; A.bonus = (A.bonus || 0) - 1; }
  else if (st.plantes >= 3) {
    // ce qui l'a fait tomber le plus souvent
    const top = Object.keys(causes).filter(k => DIALOGUES.bobos[k]).sort((x, y) => causes[y] - causes[x])[0];
    if (top) { ex = tirer('bobos_' + top, DIALOGUES.bobos[top], { nb: causes[top] }); sujet = top; }
    if (!ex) { ex = tirer('bobos_autre', DIALOGUES.bobos.autre); sujet = 'bobos'; }
  }
  else if (st.pets >= 3) ex = tirer('pets', DIALOGUES.pets);
  else if (st.t > lev.parTime) ex = tirer('retard', DIALOGUES.retard);
  else if (st.fleurs === 0) ex = tirer('pasDeFleurs', DIALOGUES.pasDeFleurs);
  else if (st.fleurs >= 15) { A.donIdx = L.length; ex = tirer('grosBouquet', DIALOGUES.grosBouquet); }
  else if (st.t < lev.parTime * .7) ex = tirer('vite', DIALOGUES.vite);
  else { A.donIdx = L.length; ex = tirer('bouquet', DIALOGUES.bouquet); }
  ajouter(ex);
  // 3) la remarque de Didi sur la journée, avec la réponse de Groloup (sauf si on vient d'en parler)
  const evt = G.event;
  if (evt && REMARQUES[evt.id] && evt.sujet !== sujet && L.length <= 4) {
    const r = piocher('rem_' + evt.id, REMARQUES[evt.id]);
    if (r) {
      L.push(['Didi', r[0].replace('{auj}', auj)]);
      L.push(['Groloup', typeof r[1] === 'function' ? r[1](st) : r[1]]);
    }
  }
  if (st.fleurs >= 15) A.bonus = (A.bonus || 0) + 1;
  if (st.t < lev.parTime * .7) A.bonus = (A.bonus || 0) + 1;
  if (st.plantes === 0) A.sansFaute = true;
}

function updateArrival(dt) {
  const A = G.arr, lev = G.lev;
  // le bouquet passe des mains de Groloup à celles de Didi (continue même si on saute les répliques)
  if (A.don != null && A.don < .7) {
    A.don += dt;
    if (A.don >= .7) for (let k = 0; k < 5; k++) part('heart', lev.didiX + 16, gyAt(lev, lev.didiX) - 18, (Math.random() - .5) * 40, -30 - Math.random() * 30, 1.1);
  }
  if (A.phase === 'roule') {
    P.vx = approach(P.vx, 38, 200 * dt);
    P.x += P.vx * dt; P.y = gyAt(lev, P.x); P.angle = Math.atan(slopeAt(lev, P.x)); P.phase += P.vx * dt / 4.2;
    P.walking = false;
    if (P.x >= A.stopX) {
      P.x = A.stopX; P.vx = 0; P.pose = 'debout'; P.angle = 0;
      A.phase = 'dialogue';
      if (A.bonus) addAmour(A.bonus, P.x, P.y - 44, (A.bonus > 0 ? '+' : '') + A.bonus + ' amour');
      if (A.sansFaute) addAmour(2, P.x + 30, P.y - 54, 'Sans faute! +2');
    }
  } else if (A.phase === 'dialogue') {
    if (A.bouquet > 0 && A.don == null && A.i >= A.donIdx) { A.don = 0; Sound.fx('fleur'); }
    const line = A.lines[A.i];
    const before = A.shown | 0;
    A.shown = Math.min(line[1].length, A.shown + 38 * dt);
    if ((A.shown | 0) !== before && (A.shown | 0) % 2 === 0) Sound.fx('blip');
    if (inp.okP || inp.jumpP) {
      if (A.shown < line[1].length) A.shown = line[1].length;
      else {
        A.i++; A.shown = 0;
        if (A.demande && A.i === A.lines.length - 1) { A.jump = true; }
        if (A.i >= A.lines.length) {
          A.phase = 'fin'; A.t = 0;
          if (A.demande) {
            G.oui = true; Sound.fx('oui');
            for (let k = 0; k < 40; k++) part('heart', P.x + 20 + (Math.random() - .5) * 60, P.y - 20 - Math.random() * 30, (Math.random() - .5) * 60, -40 - Math.random() * 60, 1.5 + Math.random());
          } else {
            Sound.fx('coeur');
            for (let k = 0; k < 8; k++) part('heart', lev.didiX + 16, P.y - 24, (Math.random() - .5) * 50, -40 - Math.random() * 40, 1.2);
          }
        }
      }
    }
  } else if (A.phase === 'fin') {
    A.t += dt;
    if (A.t > (A.demande ? 2.4 : 1.2) || (A.t > .5 && (inp.okP || inp.jumpP))) { if (A.demande) startDemande(); else startIntermede(); }
  }
  updateParticles(dt);
  updateCamera(dt, 150);
}

function startDescent() {
  setLevel(buildDescent(G.up, G.seed + 1));
  resetPlayer(G.lev.didiX - 30); P.pose = null; P.face = -1; P.vx = -60;
  G.parts = []; G.pops = [];
  G.camX = clamp(P.x - (W - 105), 0, G.lev.L - W); G.camY = gyAt(G.lev, P.x) - 112;
  setState('descend');
  Sound.play('descente' + musicNo());
  if (G.oui) pop('Elle a dit OUI!', P.x - 60, P.y - 50, '#ffb0c8', 9);
  G.becVu = false;
}

function endVisit() {
  P.wheelie = false; P.wheelieA = 0; P.angle = 0;
  G.totalFleurs += G.stats.fleurs;
  G.partie = Object.assign({ plantes: 0, temps: 0, par: 0, coeurs: 0, ours: 0, sansFaute: 0, wheelie: 0 }, G.partie || {});
  G.partie.plantes += G.stats.plantes; G.partie.temps += G.stats.t;
  G.partie.par += G.up ? G.up.parTime : 0; G.partie.coeurs += G.stats.coeurs;
  suivi('visite', G.visite, { amour: Math.floor(G.amour), temps: Math.round(G.stats.t), fleurs: G.stats.fleurs, plantes: G.stats.plantes });
  if (G.oui) { startFinale(); return; }

function updateFinale(dt) {

}

function startIntermede() {
  const nbF = G.totalFleurs + G.stats.fleurs;
  const last = G.derniers && G.derniers.typeInter != null ? TYPES_INTER[G.derniers.typeInter] : null;
  const type = piocher('typeInter', TYPES_INTER, t => t !== last && !(t === 'fleurs' && nbF < 8));
  const def = INTERMEDES[type];
  const scene = piocher('inter_' + type, def.scenes, s => !s.min || G.amour >= s.min) || def.scenes.find(s => Array.isArray(s));
  const lines = lignesDe(scene).map(l => [l[0], l[1].replace('{N}', nbF), l[2]]);
  // au revoir: Didi parle selon son humeur, Groloup lui répond
  const tier = G.amour < 25 ? 0 : G.amour < 55 ? 1 : G.amour < 85 ? 2 : 3;
  for (const l of piocher('depart' + tier, DIALOGUES.depart[tier])) lines.push(l);
  G.inter = { type, titre: def.titre, lines, i: 0, shown: 0, t: 0 };
  setState('intermede');
  Sound.play(def.musique || 'amour');
}

function updateIntermede(dt) {
  const I = G.inter;
  I.t += dt;
  if (I.t < .5) return;
  if (I.i >= I.lines.length) { if (I.t - I.doneT > .6) setState('retour'); return; }
  const line = I.lines[I.i];
  const before = I.shown | 0;
  if (line[2] && I.chante !== I.i) { I.chante = I.i; Sound.fx('chant' + line[2]); }
  I.shown = Math.min(line[1].length, I.shown + (line[2] ? 16 : 38) * dt);
  if (!line[2] && (I.shown | 0) !== before && (I.shown | 0) % 2 === 0) Sound.fx('blip');
  if (inp.okP || inp.jumpP) {
    if (I.shown < line[1].length) I.shown = line[1].length;
    else { I.i++; I.shown = 0; if (I.i >= I.lines.length) I.doneT = I.t; }
  }
}

const out = document.getElementById('screen');

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight, portrait = vh > vw;
  const availH = touchMode && portrait ? vh - 190 : vh, availW = vw;
  let s = Math.min(availW / W, availH / H);
  const si = Math.floor(s);
  if (si >= 2 && si / s > .88) s = si;
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  const left = Math.floor((vw - cw) / 2);
  const top = touchMode && portrait ? Math.max(40, Math.floor((availH - ch) / 2) + 30) : Math.floor((vh - ch) / 2);
  out.style.width = cw + 'px'; out.style.height = ch + 'px'; out.style.left = left + 'px'; out.style.top = top + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  out.width = Math.round(cw * dpr); out.height = Math.round(ch * dpr);
  S = out.width / W;
  octx.imageSmoothingEnabled = false;
  layout = { left, top, cw, ch };
  const bs = 34, m = 6;
  $('bMute').style.left = (left + cw - bs - m) + 'px'; $('bMute').style.top = (top + m) + 'px';
  $('bPause').style.left = (left + cw - 2 * bs - 2 * m) + 'px'; $('bPause').style.top = (top + m) + 'px';
  $('bFull').style.left = (left + cw - 3 * bs - 3 * m) + 'px'; $('bFull').style.top = (top + m) + 'px';
  $('rot').style.display = touchMode && portrait ? 'block' : 'none';
}

function unlockAudio() { Sound.init(); }
function toggleMute() { Sound.init(); Sound.setMuted(!Sound.muted); $('bMute').style.opacity = Sound.muted ? .45 : 1; $('bMute').innerHTML = Sound.muted ? '&#215;' : '&#9835;'; store('gd_mute', Sound.muted); }
// ---- plein écran ----
function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function fsRefus() {
  const ios = /iPhone|iPod/.test(navigator.userAgent);
  G.toast = { t: 0, txt: ios ? "L'iPhone ne permet pas le plein écran pour les pages web. Tourne ton téléphone à l'horizontale!"
    : "Plein écran bloqué ici. Ouvre le lien dans Chrome (pas dans l'app) pis réessaie." };
}
function toggleFull() {
  const d = document, el = d.documentElement;
  try {
    if (isFull()) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) { fsRefus(); return; }
    const p = req.call(el, { navigationUI: 'hide' });
    const lock = () => { try { const o = screen.orientation; if (o && o.lock) o.lock('landscape').catch(() => { }); } catch (e) { } };
    if (p && p.then) p.then(lock).catch(fsRefus); else lock();
  } catch (e) { fsRefus(); }
}
document.addEventListener('fullscreenchange', () => setTimeout(resize, 100));
document.addEventListener('webkitfullscreenchange', () => setTimeout(resize, 100));
function playing() { return G.state === 'monte' || G.state === 'descend'; }

const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', KeyQ: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump', KeyK: 'jump',

  KeyC: 'boost', KeyB: 'boost', KeyV: 'boost',

document.addEventListener('keydown', e => {
  unlockAudio();

  if (k || e.code === 'Enter' || e.code === 'ArrowDown') e.preventDefault();
  if (e.repeat) return;
  if (k === 'left') inp.left = true;
  if (k === 'right') inp.right = true;
  if (k === 'jump') { inp.jump = true; inp.jumpP = true; }
  if (k === 'tool') inp.toolP = true;
  if (k === 'boost') inp.boostP = true;
  if (e.code === 'Space') inp.okP = true;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') inp.upP = true;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') inp.downP = true;
  if (e.code === 'Enter' || e.code === 'NumpadEnter') { if (G.paused) G.paused = false; else inp.okP = true; }
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();

});

// ---- tactile ----
const tState = { L: false, R: false, J: false, T: false, B: false };
function inRect(t, el, pad) {
  const r = el.getBoundingClientRect();
  return t.clientX > r.left - pad && t.clientX < r.right + pad && t.clientY > r.top - pad && t.clientY < r.bottom + pad;
}
function enableTouch() {
  if (touchMode) return;
  touchMode = true; $('touch').style.display = 'block'; resize();
}
function onTouch(e) {
  if (e.target && e.target.closest && e.target.closest('#nomBox')) return;
  enableTouch(); unlockAudio();
  if (e.type === 'touchstart') {
    for (const t of e.changedTouches) {
      if (inRect(t, $('bMute'), 4)) { toggleMute(); continue; }
      if (inRect(t, $('bPause'), 4)) { togglePause(); continue; }
      if (inRect(t, $('bFull'), 4)) continue;
      const onBtn = ['bL', 'bR', 'bJ', 'bT', 'bB'].some(id => inRect(t, $(id), 10));
      if (!onBtn) { if (G.paused) G.paused = false; else { inp.okP = true; inp.tap = toGame(t.clientX, t.clientY); } }
    }
  }
  if (e.type === 'touchend') for (const t of e.changedTouches) if (inRect(t, $('bFull'), 4)) toggleFull();
  const a = { L: false, R: false, J: false, T: false, B: false };
  for (const t of e.touches) {
    if (inRect(t, $('bB'), 8)) a.B = true;
    if (inRect(t, $('bL'), 12)) a.L = true;
    if (inRect(t, $('bR'), 12)) a.R = true;
    if (inRect(t, $('bJ'), 12)) a.J = true;
    if (inRect(t, $('bT'), 8)) a.T = true;
  }
  if (a.J && !tState.J) { inp.jumpP = true; if (!playing()) inp.okP = true; }
  if (a.T && !tState.T) inp.toolP = true;
  if (a.B && !tState.B) inp.boostP = true;
  inp.left = a.L; inp.right = a.R; inp.jump = a.J;
  Object.assign(tState, a);
  for (const id of ['L', 'R', 'J', 'T', 'B']) $('b' + id).classList.toggle('on', a[id]);
  e.preventDefault();
}
for (const ev of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) document.addEventListener(ev, onTouch, { passive: false });
out.addEventListener('mousedown', e => { unlockAudio(); if (G.paused) { G.paused = false; return; } inp.okP = true; inp.tap = toGame(e.clientX, e.clientY); });

// ---- manette ----
let padPrev = [];
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const p = pads && pads[0];
  if (!p) return;
  const b = i => p.buttons[i] && p.buttons[i].pressed, ax = p.axes[0] || 0;
  const now = [b(0), b(2), b(9), b(14) || ax < -.4, b(15) || ax > .4, b(1)];
  if (now[5] && !padPrev[5]) inp.boostP = true;
  inp.left = now[3] || tState.L; inp.right = now[4] || tState.R;
  if (now[0] && !padPrev[0]) { inp.jumpP = true; if (!playing()) inp.okP = true; }
  inp.jump = now[0] || tState.J || inp.jump && !padPrev[0];
  if (now[1] && !padPrev[1]) inp.toolP = true;
  if (now[2] && !padPrev[2]) { if (playing() || G.paused) togglePause(); else inp.okP = true; }
  padPrev = now;
}

// ---- mise à jour ----
function update(dt) {
  switch (G.state) {
    case 'titre': updateTitle(dt); break;
    case 'aide': updateAide(dt); break;
    case 'badges': case 'honneur':
      if ((inp.okP || inp.jumpP) && G.stateT > .3) { Sound.fx('menu'); setState('titre'); }
      break;
    case 'intro':
      updateCamera(dt); ambient(dt); updateParticles(dt);
      if ((inp.okP || inp.jumpP) && G.stateT > .4) { setState('monte'); Sound.play('montee' + musicNo()); inp.jumpP = false; }
      break;
    case 'monte': case 'descend': {
      const n = Math.max(1, Math.ceil(dt / (1 / 100)));
      for (let k = 0; k < n; k++) { updatePlayer(dt / n); if (k === 0) { inp.jumpP = false; inp.toolP = false; inp.boostP = false; } }
      if (G.state === 'monte') { updateEnemies(dt); G.stats.t += dt;
        if (G.stats.t > G.lev.parTime) { addAmour(-AMOUR.retardParSec * dt); if (!P.impatient) { P.impatient = true; pop("Didi s'impatiente...", P.x, P.y - 44, '#ff9ab0'); } } }
      updateItems(dt); updateParticles(dt); ambient(dt); updateCamera(dt, G.state === 'descend' ? W - 105 : 105);
      if (G.state === 'monte' && P.x >= G.lev.didiX - 34) startArrival();
      if (G.state === 'descend' && P.x <= G.lev.homeX + 34) endVisit();
      break;
    }
    case 'arrivee': updateArrival(dt); ambient(dt); break;
    case 'intermede': updateIntermede(dt); break;
    case 'retour':
      updateParticles(dt);
      if (G.stateT > 2.2 || (G.stateT > .4 && (inp.okP || inp.jumpP))) { inp.jumpP = false; startDescent(); }
      break;
    case 'bilan':
      updateParticles(dt);
      if (G.stateT > .6 && (inp.okP || inp.jumpP)) { G.visite++; startVisit(); }
      break;
    case 'finale': updateFinale(dt); break;
  }
}

function render() {
  g.imageSmoothingEnabled = false;
  switch (G.state) {
    case 'titre': drawTitle(); break;
    case 'aide': drawAide(); break;
    case 'badges': drawBadges(); break;
    case 'honneur': drawHonneur(); break;
    case 'intro': drawIntro(); break;
    case 'monte': case 'descend': drawWorld(); drawHUD(); break;
    case 'arrivee': {
      drawWorld(); drawHUD();
      const A = G.arr;
      if (P.pose === 'debout' && G.stats.fleurs > 0 && A.phase !== 'fin') spr(SPR.bouquet, P.x - G.camX - 4, P.y - G.camY - 16);
      if (A.phase === 'dialogue') { const l = A.lines[A.i]; drawDialog(l[0], l[1], A.shown | 0); }
      if (A.phase === 'fin' && A.demande) txt('OUI!', 160, 50 - Math.abs(Math.sin(G.t * 4)) * 6, 20, '#ff6a8a', 'center');
      break;
    }
    case 'intermede': drawIntermede(); break;
    case 'retour': drawRetour(); break;
    case 'bilan': drawBilan(); break;
    case 'finale': drawFinale(); break;
  }
  if (G.toast) {
    G.toast.t += 1 / 60;
    if (G.toast.t > 5) G.toast = null;
    else {
      const lines = wrap(G.toast.txt, 5, 250);
      rect(30, 60, 260, lines.length * 9 + 12, 'rgba(16,8,28,.88)');
      lines.forEach((l, i) => txt(l, 160, 66 + i * 9, 5, '#ffe060', 'center'));
    }
  }
  drawToasts(G.dtFrame || 1 / 60);
  if (G.paused) {
    TQ.length = 0;
    g.fillStyle = 'rgba(16,8,28,.6)'; g.fillRect(0, 0, W, H);
    txt('PAUSE', 160, 70, 12, '#ffffff', 'center');
    txt(touchMode ? 'Touche pour continuer' : 'P ou Entrée pour continuer', 160, 96, 5, '#ffd0dc', 'center');
  }

  octx.drawImage(buf, 0, 0, out.width, out.height);

}

let last = performance.now(), lastReady = null;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; G.dtFrame = dt;
  try {
    pollPad();
    if (!G.paused) { G.t += dt; G.stateT += dt; update(dt); }
    render();
  } catch (err) { console.error(err); }
  inp.jumpP = inp.toolP = inp.boostP = inp.okP = inp.upP = inp.downP = false; inp.tap = null;
  const rdy = G.pet >= PET.cout; if (rdy !== lastReady) { lastReady = rdy; $('bB').classList.toggle('ready', rdy); }

}
